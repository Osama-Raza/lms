<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Lesson 5: Compare Numbers — Grade 2 Math</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --pink-1:#fff3f7;
    --pink-2:#ffe1ec;
    --berry-1:#e94f8a;
    --berry-2:#c22a68;
    --berry-dark:#8f1c4f;
    --butter:#ffcf5c;
    --butter-dark:#e6a800;
    --mint:#4fd6a8;
    --sky:#5aa9ff;
    --ink:#4a1030;
    --shadow: 0 10px 24px rgba(196,42,104,.18);
    --radius-lg: 26px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:'Nunito',sans-serif;
    background:
      radial-gradient(circle at 10% 10%, var(--pink-2) 0%, transparent 45%),
      radial-gradient(circle at 90% 20%, #ffe9d6 0%, transparent 40%),
      linear-gradient(180deg, var(--pink-1), #fff);
    color:var(--ink);
    min-height:100vh;
    overflow-x:hidden;
  }
  h1,h2,h3,.display{font-family:'Fredoka',sans-serif;}
  button{font-family:'Nunito',sans-serif;cursor:pointer;border:none;}

  .topbar{
    position:sticky;top:0;z-index:50;
    background:linear-gradient(135deg,var(--berry-1),var(--berry-2));
    color:#fff;padding:10px 16px;
    box-shadow:0 4px 14px rgba(143,28,79,.25);
  }
  .topbar-inner{max-width:900px;margin:0 auto;display:flex;align-items:center;gap:12px;}
  .topbar .lesson-title{font-family:'Fredoka';font-weight:600;font-size:1.05rem;flex:1;}
  .topbar .lesson-title small{display:block;font-family:'Nunito';font-weight:700;font-size:.68rem;opacity:.85;letter-spacing:.04em;text-transform:uppercase;}
  .stars-count{background:rgba(255,255,255,.18);border-radius:20px;padding:5px 12px;font-weight:800;font-size:.85rem;display:flex;align-items:center;gap:4px;}
  .back-btn{
    display:inline-flex;align-items:center;gap:4px;flex-shrink:0;
    background:rgba(255,255,255,.18);color:#fff;text-decoration:none;
    font-family:'Fredoka';font-weight:700;font-size:.8rem;
    padding:7px 14px;border-radius:20px;transition:background .15s ease;
  }
  .back-btn:hover{background:rgba(255,255,255,.3);}

  .progress-track{max-width:900px;margin:8px auto 0;display:flex;gap:3px;padding:0 16px;}
  .progress-dot{flex:1;height:6px;border-radius:6px;background:rgba(255,255,255,.28);transition:background .3s ease;}
  .progress-dot.done{background:var(--butter);}
  .progress-dot.active{background:#fff;}

  .stage-wrap{max-width:780px;margin:0 auto;padding:22px 16px 90px;min-height:70vh;}
  .stage{display:none;animation:fadeUp .45s ease both;}
  .stage.active{display:block;}
  @keyframes fadeUp{from{opacity:0;transform:translateY(14px);}to{opacity:1;transform:translateY(0);}}

  .stage-header{text-align:center;margin-bottom:18px;}
  .stage-eyebrow{
    display:inline-flex;align-items:center;gap:6px;
    background:var(--pink-2);color:var(--berry-dark);
    font-weight:800;font-size:.72rem;letter-spacing:.05em;text-transform:uppercase;
    padding:5px 14px;border-radius:20px;margin-bottom:8px;
  }
  .stage-header h2{font-size:1.4rem;margin:0 0 4px;color:var(--berry-dark);}
  .stage-header p{margin:0;font-weight:700;color:#7a3a5a;font-size:.9rem;}

  .card{background:#fff;border-radius:var(--radius-lg);box-shadow:var(--shadow);padding:22px;border:3px solid var(--pink-2);}

  .audio-btn{
    background:linear-gradient(135deg,var(--sky),#2f7fe0);color:#fff;font-weight:800;font-size:.85rem;
    padding:10px 18px;border-radius:30px;display:inline-flex;align-items:center;gap:8px;
    box-shadow:0 6px 14px rgba(47,127,224,.3);transition:transform .15s ease;
  }
  .audio-btn:active{transform:scale(.94);}
  .audio-btn.small{padding:7px 14px;font-size:.78rem;}
  .audio-btn .icon{font-size:1.1rem;}

  .row-center{display:flex;justify-content:center;align-items:center;gap:10px;flex-wrap:wrap;}

  .btn{font-weight:800;font-size:.95rem;padding:12px 26px;border-radius:30px;transition:transform .15s ease, box-shadow .15s ease;}
  .btn:active{transform:scale(.96);}
  .btn-primary{background:linear-gradient(135deg,var(--berry-1),var(--berry-2));color:#fff;box-shadow:0 8px 18px rgba(196,42,104,.3);}
  .btn-primary[disabled]{opacity:.4;pointer-events:none;}
  .center-btn-row{display:flex;justify-content:center;gap:10px;margin-top:18px;flex-wrap:wrap;}

  .feedback{text-align:center;font-weight:800;font-family:'Fredoka';font-size:1.02rem;min-height:1.6rem;margin-top:12px;}
  .feedback.good{color:#1a8a63;}
  .feedback.bad{color:#c23c3c;}
  .q-progress{text-align:center;font-weight:800;color:#a85778;font-size:.78rem;margin-bottom:6px;letter-spacing:.03em;text-transform:uppercase;}

  /* ---------- Emoji object groups (visual concept stages) ---------- */
  .emoji-compare-row{display:flex;justify-content:center;align-items:stretch;gap:18px;margin:16px 0;flex-wrap:wrap;}
  .emoji-group-card{
    flex:1;min-width:140px;max-width:220px;padding:18px 14px;border-radius:18px;
    background:#fff8fb;border:3px solid var(--pink-2);text-align:center;
    transition:transform .15s ease, border-color .15s ease;
  }
  .emoji-group-card.tappable{cursor:pointer;}
  .emoji-group-card.tappable:hover{transform:scale(1.03);border-color:var(--berry-1);}
  .emoji-group-card.correct-pick{background:#e3fbf3;border-color:var(--mint);}
  .emoji-group-card.wrong-pick{background:#ffe9e9;border-color:#f08a8a;}
  .emoji-row{display:flex;flex-wrap:wrap;justify-content:center;gap:4px;font-size:1.8rem;line-height:1;}

  .equation-row{
    display:flex;justify-content:center;align-items:center;gap:12px;flex-wrap:wrap;
    font-family:'Fredoka';font-weight:700;font-size:2rem;margin:14px 0;color:var(--berry-2);
    opacity:0;transform:translateY(8px);transition:opacity .4s ease, transform .4s ease;
  }
  .equation-row.show{opacity:1;transform:translateY(0);}
  .equation-row .sign{
    display:inline-flex;align-items:center;justify-content:center;
    width:44px;height:44px;border-radius:12px;background:var(--butter);color:#5a3d00;
  }

  .yesno-row{display:flex;justify-content:center;gap:14px;margin-top:16px;}
  .yesno-btn{
    padding:12px 30px;border-radius:30px;font-family:'Fredoka';font-weight:700;font-size:1.05rem;
    background:#fff;border:2.5px solid var(--pink-2);color:var(--berry-dark);
  }
  .yesno-btn:hover{border-color:var(--berry-1);}
  .yesno-btn.correct{background:#e3fbf3;border-color:var(--mint);color:#1a8a63;}
  .yesno-btn.wrong{background:#ffe9e9;border-color:#f08a8a;color:#c23c3c;}
  .yesno-btn[disabled]{pointer-events:none;}

  .sign-row{display:flex;justify-content:center;gap:14px;margin-top:18px;flex-wrap:wrap;}
  .sign-btn{
    width:70px;height:70px;border-radius:18px;background:#fff;border:2.5px solid var(--pink-2);
    font-family:'Fredoka';font-weight:700;font-size:1.9rem;color:var(--berry-dark);
    transition:transform .15s ease, border-color .15s ease;
  }
  .sign-btn:hover{border-color:var(--berry-1);}
  .sign-btn.correct{background:#e3fbf3;border-color:var(--mint);color:#1a8a63;}
  .sign-btn.selected{background:var(--pink-2);border-color:var(--berry-1);color:var(--berry-dark);}
  .feedback.neutral{color:var(--berry-dark);}
  .sign-btn.wrong{background:#ffe9e9;border-color:#f08a8a;color:#c23c3c;}
  .sign-btn[disabled]{pointer-events:none;}
  .sign-btn.highlight{outline:4px solid var(--butter);outline-offset:2px;}

  /* ---------- Number cards ---------- */
  .compare-row{display:flex;justify-content:center;align-items:center;gap:20px;margin:18px 0;flex-wrap:wrap;}
  .num-card{
    min-width:110px;padding:20px 22px;border-radius:18px;background:#fff8fb;
    border:3px solid var(--pink-2);font-family:'Fredoka';font-weight:700;font-size:2rem;
    text-align:center;color:var(--berry-dark);transition:transform .15s ease, border-color .15s ease;
  }
  .num-card.tappable{cursor:pointer;}
  .num-card.tappable:hover{transform:scale(1.04);border-color:var(--berry-1);}
  .num-card.correct-pick{background:#e3fbf3;border-color:var(--mint);color:#1a8a63;}
  .num-card.selected{background:var(--pink-2);border-color:var(--berry-1);color:var(--berry-dark);}
  .num-card.wrong-pick{background:#ffe9e9;border-color:#f08a8a;color:#c23c3c;}
  .vs-tag{font-family:'Fredoka';font-weight:700;color:#c98cae;font-size:1.1rem;}

  /* ---------- Monster ---------- */
  .monster-scene{display:flex;justify-content:center;align-items:center;gap:26px;margin:20px 0;flex-wrap:wrap;}
  .monster-num{
    font-family:'Fredoka';font-weight:700;font-size:2.4rem;color:var(--berry-dark);
    min-width:90px;text-align:center;padding:14px;border-radius:16px;background:#fff8fb;border:3px solid var(--pink-2);
  }
  .monster-num.tappable{cursor:pointer;transition:transform .15s ease;}
  .monster-num.tappable:hover{transform:scale(1.05);}
  .monster-num.correct-pick{background:#e3fbf3;border-color:var(--mint);}
  .monster-num.wrong-pick{background:#ffe9e9;border-color:#f08a8a;}
  .monster-face{
    font-size:3.6rem;transition:transform .5s cubic-bezier(.34,1.56,.64,1);
    filter:drop-shadow(0 6px 10px rgba(0,0,0,.15));
  }
  .monster-face.face-left{transform:scaleX(-1);}
  .monster-face.face-right{transform:scaleX(1);}

  /* ---------- Doors ---------- */
  .doors-row{display:flex;justify-content:center;gap:16px;margin-top:20px;flex-wrap:wrap;}
  .door{
    width:100px;height:140px;border-radius:14px 14px 8px 8px;
    background:linear-gradient(180deg,#c9793e,#a85a26);border:4px solid #7a3c15;
    display:flex;align-items:flex-end;justify-content:center;color:#fff5e6;
    font-family:'Fredoka';font-weight:700;font-size:1.3rem;padding-bottom:10px;position:relative;
    box-shadow:0 6px 14px rgba(0,0,0,.2);cursor:pointer;
  }
  .door::before{content:'';position:absolute;top:18px;width:60%;height:60%;background:rgba(255,255,255,.08);border-radius:8px;}
  .door.shake{animation:shake .4s ease;}
  .door.open{background:linear-gradient(180deg,#4fd6a8,#1a8a63);}
  .door.disabled{opacity:.5;pointer-events:none;}
  @keyframes shake{0%,100%{transform:translateX(0);}25%{transform:translateX(-8px);}75%{transform:translateX(8px);}}

  /* ---------- Race ---------- */
  .race-track{display:flex;flex-direction:column;gap:16px;margin:18px 0;}
  .race-lane{
    display:flex;align-items:center;gap:14px;background:#fff8fb;border:2.5px solid var(--pink-2);
    border-radius:16px;padding:12px 16px;cursor:pointer;transition:transform .15s ease, border-color .15s ease;
  }
  .race-lane:hover{transform:scale(1.02);border-color:var(--berry-1);}
  .race-lane.correct-pick{background:#e3fbf3;border-color:var(--mint);}
  .race-lane.wrong-pick{background:#ffe9e9;border-color:#f08a8a;}
  .race-lane .runner{font-size:2rem;}
  .race-lane .race-num{font-family:'Fredoka';font-weight:700;font-size:1.6rem;color:var(--berry-dark);}

  .stars-row{display:flex;justify-content:center;gap:4px;margin:6px 0;}
  .star-icon{font-size:1.3rem;}

  .reward-card{text-align:center;padding:36px 22px;background:linear-gradient(160deg,#fff,var(--pink-1));}
  .badge-circle{
    width:130px;height:130px;border-radius:50%;margin:0 auto 16px;
    background:linear-gradient(135deg,var(--butter),var(--butter-dark));
    display:flex;align-items:center;justify-content:center;font-size:3.4rem;
    box-shadow:0 14px 26px rgba(230,168,0,.4);border:6px solid #fff;
  }
  .reward-card h2{color:var(--berry-dark);font-size:1.7rem;margin:0 0 4px;}
  .reward-card p{color:#7a3a5a;font-weight:700;margin:0 0 10px;}
  .next-lesson-card{
    margin-top:22px;background:#fff;border:2.5px solid var(--pink-2);border-radius:18px;
    padding:16px;display:flex;align-items:center;gap:14px;text-align:left;
  }
  .next-lesson-card .lock-icon{font-size:1.6rem;}
  .next-lesson-card .txt small{display:block;color:#a85778;font-weight:800;font-size:.7rem;letter-spacing:.04em;text-transform:uppercase;}
  .next-lesson-card .txt strong{font-family:'Fredoka';color:var(--berry-dark);font-size:1.05rem;}

  @media (max-width:480px){
    .num-card{font-size:1.5rem;min-width:80px;padding:14px 10px;}
    .monster-num{font-size:1.8rem;min-width:64px;}
    .monster-face{font-size:2.8rem;}
    .door{width:78px;height:114px;font-size:1rem;}
    .sign-btn{width:56px;height:56px;font-size:1.4rem;}
    .emoji-row{font-size:1.4rem;}
  }
  @media (prefers-reduced-motion: reduce){ .stage{animation:none;} }
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-inner">
    <a class="back-btn" href="../lessons.html">&larr; Chapter</a>
    <div class="lesson-title">
      <small>Grade 2 · Math · Chapter 1: Numbers</small>
      🐊 Lesson 5: Compare Numbers
    </div>
    <div class="stars-count"><span id="starTotal">0</span> ⭐</div>
  </div>
  <div class="progress-track" id="progressTrack"></div>
</div>

<div class="stage-wrap" id="stageWrap"></div>

<script>
/* ============================================================
   LESSON 5: COMPARE NUMBERS (merged concept+practice flow)
   self-contained, no shared engine.js
   Progress saved via ../../../../../../assets/js/progress.js
   (falls back to local localStorage if that file is unavailable)

   Flow: 👀 Visual Concept → 🎯 Guided Try → 🐊 Monster → 🎮 Game
         → ✏️ Practice → ⭐ Challenge → 🏆 Reward
   Each visual concept is immediately followed by a small
   interaction, per the merged-flow request.

   Carried-forward design decisions (from Lesson 4 bug fixes):
   - Every MCQ-style activity retries until correct: a wrong pick
     disables only that option and shows encouraging feedback;
     the correct option always stays selectable.
   - The Hungry Monster activities use TAP (not drag) — a tap-to-
     turn interaction teaches the same >/< concept without the
     touch/pointer drag bugs found in Lesson 4.
============================================================ */
const TOPIC_ID = "grade2-math-ch1-lesson5-compare-numbers";
let totalStars = 0;

(function loadProgressHelper(){
  try{
    const s = document.createElement('script');
    s.src = "../../../../../../assets/js/progress.js";
    document.head.appendChild(s);
  }catch(e){ /* no-op: local fallback below still works */ }
})();
function saveStepDone(step){
  try{
    if (typeof setStepDone === 'function'){ setStepDone(TOPIC_ID, step, true); return; }
  }catch(e){}
  try{
    const key = 'progress:' + TOPIC_ID;
    const data = JSON.parse(localStorage.getItem(key) || '{}');
    data[step] = true;
    localStorage.setItem(key, JSON.stringify(data));
  }catch(e){ /* storage unavailable — fail silently, never block the lesson */ }
}

/* ---------------- Speech ---------------- */
let enVoice = null;
function pickVoice(){
  const voices = speechSynthesis.getVoices();
  enVoice = voices.find(v => v.lang === 'en-IN') ||
            voices.find(v => v.lang && v.lang.startsWith('en')) || null;
}
if ('speechSynthesis' in window){
  pickVoice();
  speechSynthesis.onvoiceschanged = pickVoice;
}
function speak(text){
  try{
    if (!('speechSynthesis' in window)) return;
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    if (enVoice) u.voice = enVoice;
    u.rate = 0.88;
    u.lang = 'en-IN';
    speechSynthesis.speak(u);
  }catch(e){ /* speech unavailable — visuals still work */ }
}

function addStar(n=1){
  totalStars += n;
  document.getElementById('starTotal').textContent = totalStars;
}
function isStageActive(stageId){
  const el = document.getElementById(stageId);
  return !!(el && el.classList.contains('active'));
}
function speakForStage(stageId, text){
  // Guards against every stage's setup code narrating itself at page
  // load (all 15 stages are BUILT immediately, only one is SHOWN) —
  // without this, hidden stages' audio overlaps whatever is on screen.
  if (isStageActive(stageId)) speak(text);
}
function shuffled(arr){ return [...arr].sort(() => Math.random() - 0.5); }
function compareSymbol(a,b){ return a > b ? '>' : (a < b ? '<' : '='); }
function signWord(sign){ return sign === '>' ? 'greater than' : (sign === '<' ? 'less than' : 'equal to'); }
function makeEmojiRow(emoji, count){
  const row = document.createElement('div');
  row.className = 'emoji-row';
  for (let i=0;i<count;i++){
    const span = document.createElement('span');
    span.textContent = emoji;
    row.appendChild(span);
  }
  return row;
}

/* ---------------- Stage machine ---------------- */
const STAGES = [
  {id:'s1'},  {id:'s2'},   // greater than: visual, quick try
  {id:'s3'},  {id:'s4'},   // less than: visual, quick try
  {id:'s5'},  {id:'s6'},   // equal to: visual, quick try
  {id:'s7'},  {id:'s8'},   // monster intro, guided monster activity
  {id:'s9'},               // which has more (numbers)
  {id:'s10'},              // choose the correct sign
  {id:'s11'},              // hungry monster game
  {id:'s12'},              // number door game
  {id:'s13'},              // number race
  {id:'s14'},              // practice
  {id:'s15'},              // mystery challenge
  {id:'reward'},
];
let currentStageIndex = 0;

function renderProgressTrack(){
  const track = document.getElementById('progressTrack');
  track.innerHTML = '';
  STAGES.forEach((st, i) => {
    const d = document.createElement('div');
    d.className = 'progress-dot' + (i < currentStageIndex ? ' done' : '') + (i === currentStageIndex ? ' active' : '');
    track.appendChild(d);
  });
}
function goToStage(index){
  currentStageIndex = index;
  document.querySelectorAll('.stage').forEach(el => el.classList.remove('active'));
  const target = document.getElementById(STAGES[index].id);
  if (target) target.classList.add('active');
  renderProgressTrack();
  saveStepDone(STAGES[index].id);
  window.scrollTo({top:0, behavior:'smooth'});
}
function completeStage(){
  if (currentStageIndex < STAGES.length - 1) goToStage(currentStageIndex + 1);
}

const wrap = document.getElementById('stageWrap');

/* ============================================================
   Reusable builder: emoji "which has more/less" visual
============================================================ */
function buildEmojiCompareStage(opts){
  // opts: {stageId, eyebrow, title, sub, emoji, countA, countB, question, mode:'more'|'less', sign, next}
  const bigger = Math.max(opts.countA, opts.countB);
  const smaller = Math.min(opts.countA, opts.countB);
  const targetCount = opts.mode === 'more' ? bigger : smaller;
  wrap.insertAdjacentHTML('beforeend', `
  <section class="stage" id="${opts.stageId}">
    <div class="stage-header">
      <div class="stage-eyebrow">${opts.eyebrow}</div>
      <h2>${opts.title}</h2>
      <p>${opts.sub}</p>
    </div>
    <div class="card">
      <div class="row-center"><button class="audio-btn small" id="${opts.stageId}Play"><span class="icon">🔊</span> ${opts.question}</button></div>
      <div class="emoji-compare-row" id="${opts.stageId}Groups"></div>
      <div class="equation-row" id="${opts.stageId}Equation"></div>
      <div class="feedback" id="${opts.stageId}Feedback"></div>
      <div class="center-btn-row"><button class="btn btn-primary" id="${opts.stageId}Next" disabled>Next ➜</button></div>
    </div>
  </section>`);
  const groupsWrap = document.getElementById(opts.stageId + 'Groups');
  [opts.countA, opts.countB].forEach(count => {
    const card = document.createElement('div');
    card.className = 'emoji-group-card tappable';
    card.appendChild(makeEmojiRow(opts.emoji, count));
    card.onclick = () => {
      const fb = document.getElementById(opts.stageId + 'Feedback');
      if (count === targetCount){
        document.querySelectorAll(`#${opts.stageId}Groups .emoji-group-card`).forEach(c => c.classList.remove('tappable'));
        card.classList.add('correct-pick');
        fb.textContent = 'Great! 🎉';
        fb.className = 'feedback good';
        addStar(1);
        const eq = document.getElementById(opts.stageId + 'Equation');
        eq.innerHTML = `${smaller} <span class="sign">${opts.sign}</span> ${bigger}`;
        eq.classList.add('show');
        speak(`${smaller} is ${signWord(opts.sign)} ${bigger}.`);
        document.getElementById(opts.stageId + 'Next').disabled = false;
      } else {
        card.classList.add('wrong-pick');
        fb.textContent = 'Try again, you are very close!';
        fb.className = 'feedback bad';
        speak('Try again, you are very close!');
        setTimeout(() => card.classList.remove('wrong-pick'), 700);
      }
    };
    groupsWrap.appendChild(card);
  });
  document.getElementById(opts.stageId + 'Play').onclick = () => speak(opts.question);
  setTimeout(() => speakForStage(opts.stageId, opts.question), 400);
  document.getElementById(opts.stageId + 'Next').onclick = () => completeStage();
}

/* ============================================================
   Reusable builder: "Quick Try" — choose the sign for an
   emoji pair (immediately follows each visual concept)
============================================================ */
function buildQuickTryStage(opts){
  // opts: {stageId, eyebrow, emoji, countA, countB}
  const answer = compareSymbol(opts.countA, opts.countB);
  wrap.insertAdjacentHTML('beforeend', `
  <section class="stage" id="${opts.stageId}">
    <div class="stage-header">
      <div class="stage-eyebrow">${opts.eyebrow}</div>
      <h2>🎯 Quick Try</h2>
      <p>Choose the sign.</p>
    </div>
    <div class="card">
      <div class="emoji-compare-row" id="${opts.stageId}Groups"></div>
      <div class="sign-row" id="${opts.stageId}Signs"></div>
      <div class="equation-row" id="${opts.stageId}Equation"></div>
      <div class="feedback" id="${opts.stageId}Feedback"></div>
    </div>
  </section>`);
  const groupsWrap = document.getElementById(opts.stageId + 'Groups');
  [opts.countA, opts.countB].forEach(count => {
    const card = document.createElement('div');
    card.className = 'emoji-group-card';

    track.appendChild(lane);
  });
  document.getElementById('s13Play').onclick = () => speak('Who is winning?');
  setTimeout(() => speakForStage('s13', 'Who is winning?'), 400);
})();
document.getElementById('s13Next').onclick = () => completeStage();

/* ============================================================
   PART 10 — Practice (5 questions, mixed types, score summary)
============================================================ */
const s14Questions = [
  {type:'sign', a:245, b:425},
  {type:'sign', a:638, b:683},
  {type:'sign', a:700, b:700},
  {type:'pick', prompt:'Which is bigger?', options:[506,560], answer:560},
  {type:'pick', prompt:'Which is smaller?', options:[321,312], answer:312},
];
let s14Index = 0;
let s14CorrectCount = 0;
wrap.insertAdjacentHTML('beforeend', `
<section class="stage" id="s14">
  <div class="stage-header">
    <div class="stage-eyebrow">Part 10 · Practice</div>
    <h2>Quick Practice</h2>
    <p>Five short questions.</p>
  </div>
  <div class="card" id="s14Intro">
    <p style="text-align:center;font-weight:700;color:#7a3a5a;">You're going to answer 5 questions on your own now. Take your time and do your best!</p>
    <div class="center-btn-row"><button class="btn btn-primary" id="s14Start">Start Practice ▶</button></div>
  </div>
  <div class="card" id="s14Quiz" style="display:none;">
    <div class="q-progress" id="s14Progress"></div>
    <div id="s14Prompt" style="text-align:center;font-family:'Fredoka';font-weight:700;font-size:1.1rem;color:var(--berry-dark);margin-bottom:6px;"></div>
    <div class="compare-row" id="s14Pair"></div>
    <div id="s14SignArea" class="sign-row"></div>
    <div id="s14PickArea" class="compare-row"></div>
    <div class="feedback" id="s14Feedback"></div>
  </div>
</section>`);
document.getElementById('s14Start').onclick = () => {
  document.getElementById('s14Intro').style.display = 'none';
  document.getElementById('s14Quiz').style.display = 'block';
  speak("Now you're going to answer some questions on your own. Let's begin!");
  renderS14();
};
function renderS14(){
  const q = s14Questions[s14Index];
  document.getElementById('s14Progress').textContent = `Question ${s14Index+1} of ${s14Questions.length}`;
  document.getElementById('s14Feedback').textContent = '';
  document.getElementById('s14SignArea').innerHTML = '';
  document.getElementById('s14PickArea').innerHTML = '';
  document.getElementById('s14Pair').innerHTML = '';

  if (q.type === 'sign'){
    document.getElementById('s14Prompt').textContent = 'Choose the correct sign.';
    document.getElementById('s14Pair').innerHTML = `<div class="num-card">${q.a}</div><div class="vs-tag">?</div><div class="num-card">${q.b}</div>`;
    const answer = compareSymbol(q.a, q.b);
    const signWrap = document.getElementById('s14SignArea');
    ['>','<','='].forEach(sign => {
      const btn = document.createElement('button');
      btn.className = 'sign-btn';
      btn.textContent = sign;
      btn.onclick = () => handleS14Answer(sign, answer, btn, false);
      signWrap.appendChild(btn);
    });
    speakForStage('s14', `${q.a} question mark ${q.b}`);
  } else {
    document.getElementById('s14Prompt').textContent = q.prompt;
    const pickWrap = document.getElementById('s14PickArea');
    shuffled(q.options).forEach(n => {
      const card = document.createElement('div');
      card.className = 'num-card tappable';
      card.textContent = n;
      card.onclick = () => handleS14Answer(n, q.answer, card, true);
      pickWrap.appendChild(card);
    });
    speakForStage('s14', q.prompt);
  }
}
function handleS14Answer(picked, answer, el, isPickCard){
  const fb = document.getElementById('s14Feedback');
  if (isPickCard){
    document.querySelectorAll('#s14PickArea .num-card').forEach(c => c.classList.remove('tappable'));
    el.classList.add('selected');
  } else {
    document.querySelectorAll('#s14SignArea .sign-btn').forEach(x => x.disabled = true);
    el.classList.add('selected');
  }
  if (picked === answer) s14CorrectCount++;
  fb.textContent = 'Got it! Next question…';
  fb.className = 'feedback neutral';
  speak('Got it. Next question.');
  setTimeout(() => {
    s14Index++;
    if (s14Index >= s14Questions.length) showS14Summary();
    else renderS14();
  }, 1100);
}
function showS14Summary(){
  document.getElementById('s14Progress').textContent = 'Practice Complete!';
  document.getElementById('s14Prompt').textContent = `You got ${s14CorrectCount} out of ${s14Questions.length} correct!`;
  document.getElementById('s14Pair').innerHTML = '';
  document.getElementById('s14SignArea').innerHTML = '';
  const pickWrap = document.getElementById('s14PickArea');
  pickWrap.innerHTML = '';
  const btn = document.createElement('button');
  btn.className = 'btn btn-primary';
  btn.textContent = 'Continue ➜';
  btn.onclick = () => completeStage();
  pickWrap.appendChild(btn);
  addStar(s14CorrectCount);
  document.getElementById('s14Feedback').textContent =
    s14CorrectCount === s14Questions.length ? 'Perfect score! 🌟' : 'Great effort! 🎉';
  document.getElementById('s14Feedback').className = 'feedback good';
  speak(`You got ${s14CorrectCount} out of ${s14Questions.length} correct!`);
}


/* ============================================================
   PART 11 — Mystery Challenge
============================================================ */
const s15A = 572, s15B = 527;
const s15Answer = compareSymbol(s15A, s15B);
wrap.insertAdjacentHTML('beforeend', `
<section class="stage" id="s15">
  <div class="stage-header">
    <div class="stage-eyebrow">Part 11 · Mystery Challenge</div>
    <h2>⭐ Final Challenge</h2>
  </div>
  <div class="card">
    <div id="s15Stage1">
      <div class="row-center"><button class="audio-btn small" id="s15Play"><span class="icon">🔊</span> Which is bigger?</button></div>
      <div class="compare-row" id="s15Pair"></div>
    </div>
    <div id="s15Stage2" style="display:none;">
      <p style="text-align:center;font-weight:800;color:#7a3a5a;">Now choose the sign:</p>
      <div class="compare-row"><div class="num-card">${s15A}</div><div class="vs-tag">?</div><div class="num-card">${s15B}</div></div>
      <div class="sign-row" id="s15Signs"></div>
    </div>
    <div class="equation-row" id="s15Equation"></div>
    <div class="feedback" id="s15Feedback"></div>
  </div>
</section>`);
(function setupS15(){
  document.getElementById('s15Play').onclick = () => speak('Which number is bigger?');
  setTimeout(() => speakForStage('s15', 'Which number is bigger?'), 400);
  const pairWrap = document.getElementById('s15Pair');
  shuffled([s15A, s15B]).forEach(n => {
    const card = document.createElement('div');
    card.className = 'num-card tappable';
    card.textContent = n;
    card.onclick = () => {
      const fb = document.getElementById('s15Feedback');
      if (n === Math.max(s15A, s15B)){
        document.querySelectorAll('#s15Pair .num-card').forEach(c => c.classList.remove('tappable'));
        card.classList.add('correct-pick');
        fb.textContent = "That's bigger! 🎉";
        fb.className = 'feedback good';
        addStar(1);
        speak(n + ' is bigger!');
        setTimeout(() => {
          document.getElementById('s15Stage1').style.display = 'none';
          document.getElementById('s15Stage2').style.display = 'block';
          fb.textContent = '';
          setupSignStage();
        }, 1200);
      } else {
        card.classList.add('wrong-pick');
        fb.textContent = 'Try again, you are very close!';
        fb.className = 'feedback bad';
        speak('Try again, you are very close!');
        setTimeout(() => card.classList.remove('wrong-pick'), 700);
      }
    };
    pairWrap.appendChild(card);
  });

  function setupSignStage(){
    speakForStage('s15', `${s15A} question mark ${s15B}`);
    const signWrap = document.getElementById('s15Signs');
    ['>','<','='].forEach(sign => {
      const btn = document.createElement('button');
      btn.className = 'sign-btn';
      btn.textContent = sign;
      btn.onclick = () => {
        const fb = document.getElementById('s15Feedback');
        if (sign === s15Answer){
          document.querySelectorAll('#s15Signs .sign-btn').forEach(x => x.disabled = true);
          btn.classList.add('correct');
          fb.textContent = 'Correct! 🎉';
          fb.className = 'feedback good';
          addStar(1);
          speak(`${s15A} is ${signWord(s15Answer)} ${s15B}.`);
          const eq = document.getElementById('s15Equation');
          eq.innerHTML = `${s15A} <span class="sign">${s15Answer}</span> ${s15B}`;
          eq.classList.add('show');
          setTimeout(() => showReward(), 1700);
        } else {
          btn.classList.add('wrong');
          btn.disabled = true;
          fb.textContent = 'Try again, you are very close!';
          fb.className = 'feedback bad';
          speak('Try again, you are very close!');
        }
      };
      signWrap.appendChild(btn);
    });
  }
})();

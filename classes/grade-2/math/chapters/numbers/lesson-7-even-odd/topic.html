<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Lesson 7: Even &amp; Odd — Grade 2 Math</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --pink-1:#fff3f7;
    --pink-2:#ffe1ec;
    --berry-1:#e94f8a;
    --berry-2:#c22a68;
    --berry-dark:#8f1c4f;
    --butter:#ffcf5c;
    --butter-dark:#e6a800;
    --mint:#4fd6a8;
    --sky:#5aa9ff;
    --ink:#4a1030;
    --shadow: 0 10px 24px rgba(196,42,104,.18);
    --radius-lg: 26px;
    --even:#4fd6a8;
    --odd:#ff9d5c;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:'Nunito',sans-serif;
    background:
      radial-gradient(circle at 10% 10%, var(--pink-2) 0%, transparent 45%),
      radial-gradient(circle at 90% 20%, #ffe9d6 0%, transparent 40%),
      linear-gradient(180deg, var(--pink-1), #fff);
    color:var(--ink);
    min-height:100vh;
    overflow-x:hidden;
  }
  h1,h2,h3,.display{font-family:'Fredoka',sans-serif;}
  button{font-family:'Nunito',sans-serif;cursor:pointer;border:none;}

  .topbar{
    position:sticky;top:0;z-index:50;
    background:linear-gradient(135deg,var(--berry-1),var(--berry-2));
    color:#fff;padding:10px 16px;
    box-shadow:0 4px 14px rgba(143,28,79,.25);
  }
  .topbar-inner{max-width:900px;margin:0 auto;display:flex;align-items:center;gap:12px;}
  .topbar .lesson-title{font-family:'Fredoka';font-weight:600;font-size:1.05rem;flex:1;}
  .topbar .lesson-title small{display:block;font-family:'Nunito';font-weight:700;font-size:.68rem;opacity:.85;letter-spacing:.04em;text-transform:uppercase;}
  .stars-count{background:rgba(255,255,255,.18);border-radius:20px;padding:5px 12px;font-weight:800;font-size:.85rem;display:flex;align-items:center;gap:4px;}
  .back-btn{
    display:inline-flex;align-items:center;gap:4px;flex-shrink:0;
    background:rgba(255,255,255,.18);color:#fff;text-decoration:none;
    font-family:'Fredoka';font-weight:700;font-size:.8rem;
    padding:7px 14px;border-radius:20px;transition:background .15s ease;
  }
  .back-btn:hover{background:rgba(255,255,255,.3);}

  .progress-track{max-width:900px;margin:8px auto 0;display:flex;gap:3px;padding:0 16px;}
  .progress-dot{flex:1;height:6px;border-radius:6px;background:rgba(255,255,255,.28);transition:background .3s ease;}
  .progress-dot.done{background:var(--butter);}
  .progress-dot.active{background:#fff;}

  .stage-wrap{max-width:780px;margin:0 auto;padding:22px 16px 90px;min-height:70vh;}
  .stage{display:none;animation:fadeUp .45s ease both;}
  .stage.active{display:block;}
  @keyframes fadeUp{from{opacity:0;transform:translateY(14px);}to{opacity:1;transform:translateY(0);}}

  .stage-header{text-align:center;margin-bottom:18px;}
  .stage-eyebrow{
    display:inline-flex;align-items:center;gap:6px;
    background:var(--pink-2);color:var(--berry-dark);
    font-weight:800;font-size:.72rem;letter-spacing:.05em;text-transform:uppercase;
    padding:5px 14px;border-radius:20px;margin-bottom:8px;
  }
  .stage-header h2{font-size:1.4rem;margin:0 0 4px;color:var(--berry-dark);}
  .stage-header p{margin:0;font-weight:700;color:#7a3a5a;font-size:.9rem;}

  .card{background:#fff;border-radius:var(--radius-lg);box-shadow:var(--shadow);padding:22px;border:3px solid var(--pink-2);}

  .audio-btn{
    background:linear-gradient(135deg,var(--sky),#2f7fe0);color:#fff;font-weight:800;font-size:.85rem;
    padding:10px 18px;border-radius:30px;display:inline-flex;align-items:center;gap:8px;
    box-shadow:0 6px 14px rgba(47,127,224,.3);transition:transform .15s ease;
  }
  .audio-btn:active{transform:scale(.94);}
  .audio-btn.small{padding:7px 14px;font-size:.78rem;}
  .audio-btn .icon{font-size:1.1rem;}

  .row-center{display:flex;justify-content:center;align-items:center;gap:10px;flex-wrap:wrap;}

  .btn{font-weight:800;font-size:.95rem;padding:12px 26px;border-radius:30px;transition:transform .15s ease, box-shadow .15s ease;}
  .btn:active{transform:scale(.96);}
  .btn-primary{background:linear-gradient(135deg,var(--berry-1),var(--berry-2));color:#fff;box-shadow:0 8px 18px rgba(196,42,104,.3);}
  .btn-primary[disabled]{opacity:.4;pointer-events:none;}
  .center-btn-row{display:flex;justify-content:center;gap:10px;margin-top:18px;flex-wrap:wrap;}

  .feedback{text-align:center;font-weight:800;font-family:'Fredoka';font-size:1.02rem;min-height:1.6rem;margin-top:12px;}
  .feedback.good{color:#1a8a63;}
  .feedback.bad{color:#c23c3c;}
  .feedback.neutral{color:var(--berry-dark);}
  .q-progress{text-align:center;font-weight:800;color:#a85778;font-size:.78rem;margin-bottom:6px;letter-spacing:.03em;text-transform:uppercase;}

  /* ---------- EVEN/ODD badge ---------- */
  .parity-badge{
    display:inline-flex;align-items:center;gap:8px;
    padding:10px 22px;border-radius:30px;font-family:'Fredoka';font-weight:700;font-size:1.15rem;
    margin:10px 0;opacity:0;transform:scale(.85);transition:opacity .4s ease, transform .4s ease;
  }
  .parity-badge.show{opacity:1;transform:scale(1);}
  .parity-badge.even{background:#e3fbf3;color:#1a8a63;}
  .parity-badge.odd{background:#ffe9da;color:#c2650e;}

  /* ---------- Emoji rows (Discover) ---------- */
  .emoji-pair-row{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;font-size:2rem;margin:14px 0;}
  .emoji-pair-row .pair-unit{display:inline-flex;gap:2px;padding:4px 6px;border-radius:10px;}
  .emoji-pair-row .pair-unit.linked{background:var(--pink-2);}
  .emoji-pair-row .lone-unit{position:relative;}
  .emoji-pair-row .lone-unit::after{
    content:'?';position:absolute;top:-14px;right:-10px;
    background:var(--odd);color:#fff;width:20px;height:20px;border-radius:50%;
    font-family:'Fredoka';font-weight:700;font-size:.85rem;display:flex;align-items:center;justify-content:center;
  }

  /* ---------- Pairing widget (socks / animals) ---------- */
  .pairing-row{display:flex;flex-wrap:wrap;justify-content:center;gap:14px;margin:16px 0;}
  .count-display{
    text-align:center;font-family:'Fredoka';font-weight:700;font-size:1.05rem;
    color:var(--berry-dark);background:var(--pink-1);border:2px solid var(--pink-2);
    border-radius:16px;padding:8px 16px;display:inline-block;margin:0 auto 10px;
  }
  .count-display-wrap{text-align:center;}
  .pair-tile{
    width:64px;height:64px;border-radius:16px;background:#fff8fb;border:3px solid var(--pink-2);
    display:flex;align-items:center;justify-content:center;font-size:1.8rem;cursor:pointer;
    transition:transform .15s ease, border-color .15s ease;position:relative;
  }
  .pair-tile:hover{transform:scale(1.05);border-color:var(--berry-1);}
  .pair-tile.selecting{border-color:var(--sky);background:#eaf6ff;}
  .pair-tile.paired{border-color:var(--mint);background:#e3fbf3;pointer-events:none;}
  .pair-tile.alone{border-color:var(--odd);background:#ffe9da;pointer-events:none;}
  .pair-tile.alone::after{
    content:'?';position:absolute;top:-10px;right:-8px;
    background:var(--odd);color:#fff;width:20px;height:20px;border-radius:50%;
    font-family:'Fredoka';font-weight:700;font-size:.8rem;display:flex;align-items:center;justify-content:center;
  }

  /* ---------- Yes/No buttons ---------- */
  .yesno-row{display:flex;justify-content:center;gap:14px;margin-top:16px;}
  .yesno-btn{
    padding:12px 30px;border-radius:30px;font-family:'Fredoka';font-weight:700;font-size:1.05rem;
    background:#fff;border:2.5px solid var(--pink-2);color:var(--berry-dark);
  }
  .yesno-btn:hover{border-color:var(--berry-1);}
  .yesno-btn.correct{background:#e3fbf3;border-color:var(--mint);color:#1a8a63;}
  .yesno-btn.wrong{background:#ffe9e9;border-color:#f08a8a;color:#c23c3c;}
  .yesno-btn.selected{background:var(--pink-2);border-color:var(--berry-1);}
  .yesno-btn[disabled]{pointer-events:none;}

  /* ---------- EVEN/ODD basket buttons ---------- */
  .basket-row{display:flex;justify-content:center;gap:18px;margin-top:18px;flex-wrap:wrap;}
  .basket-btn{
    flex:1;min-width:140px;max-width:200px;padding:20px 14px;border-radius:20px;text-align:center;
    font-family:'Fredoka';font-weight:700;font-size:1.15rem;cursor:pointer;
    border:3px solid var(--pink-2);background:#fff8fb;transition:transform .15s ease, border-color .15s ease;
  }
  .basket-btn:hover{transform:scale(1.03);}
  .basket-btn .basket-icon{font-size:2rem;display:block;margin-bottom:4px;}
  .basket-btn.even{color:#1a8a63;}
  .basket-btn.even:hover{border-color:var(--even);}
  .basket-btn.odd{color:#c2650e;}
  .basket-btn.odd:hover{border-color:var(--odd);}
  .basket-btn.correct{background:#e3fbf3;border-color:var(--mint);}
  .basket-btn.wrong{background:#ffe9e9;border-color:#f08a8a;}
  .basket-btn.selected{background:var(--pink-2);}
  .basket-btn[disabled]{pointer-events:none;}

  .falling-number{
    font-family:'Fredoka';font-weight:700;font-size:3rem;text-align:center;color:var(--berry-2);
    margin:10px 0;text-shadow:0 4px 0 var(--pink-2);
    animation:fall .5s ease both;
  }
  @keyframes fall{from{transform:translateY(-16px);opacity:0;}to{transform:translateY(0);opacity:1;}}

  /* ---------- Number Hunt scene ---------- */
  .hunt-scene{display:flex;flex-wrap:wrap;justify-content:center;gap:16px;margin:18px 0;}
  .hunt-item{
    width:88px;height:88px;border-radius:18px;background:#fff8fb;border:3px solid var(--pink-2);
    display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;
    transition:transform .15s ease, border-color .15s ease;
  }
  .hunt-item:hover{transform:scale(1.05);border-color:var(--berry-1);}
  .hunt-item .hunt-emoji{font-size:1.7rem;}
  .hunt-item .hunt-num{font-family:'Fredoka';font-weight:700;color:var(--berry-dark);font-size:1.05rem;}
  .hunt-item.correct-pick{border-color:var(--mint);background:#e3fbf3;}
  .hunt-item.wrong-pick{animation:wiggle .4s ease;}
  .hunt-item.locked{pointer-events:none;opacity:.6;}
  @keyframes wiggle{0%,100%{transform:rotate(0);}25%{transform:rotate(-8deg);}75%{transform:rotate(8deg);}}

  /* ---------- Traffic light ---------- */
  .traffic-light{
    width:70px;margin:0 auto;background:#3a3a3a;border-radius:16px;padding:12px 0;
    display:flex;flex-direction:column;align-items:center;gap:10px;
  }
  .traffic-btn{
    width:48px;height:48px;border-radius:50%;border:3px solid rgba(255,255,255,.25);
    cursor:pointer;transition:transform .15s ease;
  }
  .traffic-btn:hover{transform:scale(1.08);}
  .traffic-btn.green{background:radial-gradient(circle at 35% 30%, #7ef0c4, var(--even));}
  .traffic-btn.red{background:radial-gradient(circle at 35% 30%, #ffb27e, var(--odd));}
  .traffic-btn[disabled]{opacity:.4;pointer-events:none;}
  .traffic-btn.wrong-flash{outline:3px solid #c23c3c;}

  /* ---------- Number sequence display ---------- */
  .num-sequence{
    display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin:16px 0;
    font-family:'Fredoka';font-weight:700;font-size:1.6rem;color:var(--berry-dark);
  }
  .num-sequence span{background:var(--pink-1);border:2px solid var(--pink-2);border-radius:12px;padding:8px 14px;}

  /* ---------- Options ---------- */
  .options{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-top:16px;}
  .opt-btn{
    background:#fff;border:2.5px solid var(--pink-2);color:var(--ink);border-radius:14px;
    padding:14px 8px;font-family:'Fredoka';font-weight:600;font-size:1.1rem;text-align:center;
  }
  .opt-btn:hover{border-color:var(--berry-1);}
  .opt-btn.correct{background:#e3fbf3;border-color:var(--mint);color:#1a8a63;}
  .opt-btn.wrong{background:#ffe9e9;border-color:#f08a8a;color:#c23c3c;}
  .opt-btn.selected{background:var(--pink-2);border-color:var(--berry-1);color:var(--berry-dark);}
  .opt-btn[disabled]{pointer-events:none;}

  .stars-row{display:flex;justify-content:center;gap:4px;margin:6px 0;}
  .star-icon{font-size:1.3rem;}

  .reward-card{text-align:center;padding:36px 22px;background:linear-gradient(160deg,#fff,var(--pink-1));}
  .badge-circle{
    width:130px;height:130px;border-radius:50%;margin:0 auto 16px;
    background:linear-gradient(135deg,var(--butter),var(--butter-dark));
    display:flex;align-items:center;justify-content:center;font-size:3.4rem;
    box-shadow:0 14px 26px rgba(230,168,0,.4);border:6px solid #fff;
  }
  .reward-card h2{color:var(--berry-dark);font-size:1.7rem;margin:0 0 4px;}
  .reward-card p{color:#7a3a5a;font-weight:700;margin:0 0 10px;}
  .next-lesson-card{
    margin-top:22px;background:#fff;border:2.5px solid var(--pink-2);border-radius:18px;
    padding:16px;display:flex;align-items:center;gap:14px;text-align:left;
  }
  .next-lesson-card .lock-icon{font-size:1.6rem;}
  .next-lesson-card .txt small{display:block;color:#a85778;font-weight:800;font-size:.7rem;letter-spacing:.04em;text-transform:uppercase;}
  .next-lesson-card .txt strong{font-family:'Fredoka';color:var(--berry-dark);font-size:1.05rem;}

  @media (max-width:480px){
    .options{grid-template-columns:1fr 1fr;}
    .pair-tile{width:54px;height:54px;font-size:1.5rem;}
    .hunt-item{width:74px;height:74px;}
    .basket-btn{min-width:120px;padding:16px 10px;font-size:1rem;}
    .emoji-pair-row{font-size:1.6rem;}
  }
  @media (prefers-reduced-motion: reduce){ .stage{animation:none;} .falling-number{animation:none;} }
</style>

<div class="topbar">
  <div class="topbar-inner">

</div>

<div class="stage-wrap" id="stageWrap"></div>

<script>
/* ============================================================
   LESSON 7: EVEN & ODD — self-contained, no shared engine.js.
   Progress saved via ../../../../../../assets/js/progress.js
   (falls back to local localStorage if that file is unavailable)

   Per the spec's own note, this lesson deliberately varies its
   interaction styles (pairing, yes/no, falling-number sorting,
   hunt-and-click, traffic lights, pattern discovery) instead of
   reusing drag/number-card patterns from earlier lessons — same
   pink/berry Math palette and design system as the rest of
   Chapter 1, continuing Lesson 1's own rule that every topic
   keeps its interactions feeling fresh rather than repetitive.

   Carried-forward fixes from earlier lessons:
   - speakForStage() guard against the multi-voice overlap bug.
   - Retry-until-correct on MCQ/tap activities outside Practice.
   - Quick Practice: intro alert screen, no live right/wrong
     reveal per question, score + stars revealed only at the end.
============================================================ */
const TOPIC_ID = "grade2-math-ch1-lesson7-even-odd";
let totalStars = 0;

(function loadProgressHelper(){
  try{
    const s = document.createElement('script');
    s.src = "../../../../../../assets/js/progress.js";
    document.head.appendChild(s);
  }catch(e){ /* no-op: local fallback below still works */ }
})();
function saveStepDone(step){
  try{
    if (typeof setStepDone === 'function'){ setStepDone(TOPIC_ID, step, true); return; }
  }catch(e){}
  try{
    const key = 'progress:' + TOPIC_ID;
    const data = JSON.parse(localStorage.getItem(key) || '{}');
    data[step] = true;
    localStorage.setItem(key, JSON.stringify(data));
  }catch(e){ /* storage unavailable — fail silently, never block the lesson */ }
}

/* ---------------- Speech ---------------- */
let enVoice = null;
function pickVoice(){
  const voices = speechSynthesis.getVoices();
  enVoice = voices.find(v => v.lang === 'en-IN') ||
            voices.find(v => v.lang && v.lang.startsWith('en')) || null;
}
if ('speechSynthesis' in window){
  pickVoice();
  speechSynthesis.onvoiceschanged = pickVoice;
}
function speak(text){
  try{
    if (!('speechSynthesis' in window)) return;
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    if (enVoice) u.voice = enVoice;
    u.rate = 0.88;
    u.lang = 'en-IN';
    speechSynthesis.speak(u);
  }catch(e){ /* speech unavailable — visuals still work */ }
}
function isStageActive(stageId){
  const el = document.getElementById(stageId);
  return !!(el && el.classList.contains('active'));
}
function speakForStage(stageId, text){
  if (isStageActive(stageId)) speak(text);
}

function addStar(n=1){
  totalStars += n;
  document.getElementById('starTotal').textContent = totalStars;
}
function shuffled(arr){ return [...arr].sort(() => Math.random() - 0.5); }
function isEven(n){ return n % 2 === 0; }

/* ---------------- Stage machine ---------------- */
const STAGES = [
  {id:'s1'},   // discover
  {id:'s2'},   // make the pairs (socks)
  {id:'s3'},   // odd one out (carrots)
  {id:'s4'},   // number sorting (falling numbers)
  {id:'s5'},   // number hunt
  {id:'s6'},   // traffic lights
  {id:'s7'},   // pairing game (animals)
  {id:'s8'},   // number rule discovery
  {id:'s9'},   // quick practice
  {id:'s10'},  // super challenge
  {id:'reward'},
];
let currentStageIndex = 0;

function renderProgressTrack(){
  const track = document.getElementById('progressTrack');
  track.innerHTML = '';
  STAGES.forEach((st, i) => {
    const d = document.createElement('div');
    d.className = 'progress-dot' + (i < currentStageIndex ? ' done' : '') + (i === currentStageIndex ? ' active' : '');
    track.appendChild(d);
  });
}
function goToStage(index){
  currentStageIndex = index;
  document.querySelectorAll('.stage').forEach(el => el.classList.remove('active'));
  const target = document.getElementById(STAGES[index].id);
  if (target) target.classList.add('active');
  renderProgressTrack();
  saveStepDone(STAGES[index].id);
  window.scrollTo({top:0, behavior:'smooth'});
}
function completeStage(){
  if (currentStageIndex < STAGES.length - 1) goToStage(currentStageIndex + 1);
}

const wrap = document.getElementById('stageWrap');

/* ============================================================
   Reusable: pairing widget (Activity 2 socks / Activity 7 animals)
============================================================ */
function wirePairingRound(opts){
  // opts: {containerEl, items:[emoji,...], countEl, onComplete(isEvenResult)}
  containerReset(opts.containerEl);
  let selected = null;
  let remaining = opts.items.length;
  if (opts.countEl) opts.countEl.textContent = `Counted so far: 0`;
  const tiles = opts.items.map((emoji, i) => {
    const tile = document.createElement('div');
    tile.className = 'pair-tile';
    tile.textContent = emoji;
    tile.dataset.index = i;
    tile.onclick = () => {
      if (tile.classList.contains('paired') || tile.classList.contains('alone')) return;
      if (selected === null){
        selected = tile;
        tile.classList.add('selecting');
        return;
      }
      if (selected === tile){
        tile.classList.remove('selecting');
        selected = null;
        return;
      }
      selected.classList.remove('selecting');
      selected.classList.add('paired');
      tile.classList.add('paired');
      selected = null;
      remaining -= 2;
      const countedSoFar = opts.items.length - remaining;
      if (opts.countEl) opts.countEl.textContent = `Counted so far: ${countedSoFar}`;
      if (remaining === 1){
        const loneTile = [...opts.containerEl.children].find(t => !t.classList.contains('paired'));
        if (loneTile) loneTile.classList.add('alone');
        if (opts.countEl) opts.countEl.textContent = `Counted so far: ${opts.items.length}`;
        if (opts.onComplete) opts.onComplete(false);
      } else if (remaining === 0){
        if (opts.onComplete) opts.onComplete(true);
      }
    };
    opts.containerEl.appendChild(tile);
    return tile;
  });
  return tiles;
}
function containerReset(el){ el.innerHTML = ''; }

/* ============================================================
   PART 1 — Discover: Do They Have a Partner?
============================================================ */
const s1Demo = [
  {count:4, emoji:'🍎', result:'even', line:'Everyone has a partner. 4 is EVEN.'},
  {count:5, emoji:'🍎', result:'odd', line:'One is alone. 5 is ODD.'},
];
let s1Step = 0;
wrap.insertAdjacentHTML('beforeend', `
<section class="stage" id="s1">
  <div class="stage-header">
    <div class="stage-eyebrow">Activity 1 · Discover</div>
    <h2>Do They Have a Partner?</h2>
    <p id="s1Sub">Watch the apples find a partner.</p>
  </div>
  <div class="card" id="s1DemoCard">
    <div class="emoji-pair-row" id="s1Row"></div>
    <div class="parity-badge" id="s1Badge"></div>
    <div class="row-center"><button class="audio-btn small" id="s1Listen"><span class="icon">🔊</span> Listen Again</button></div>
    <div class="center-btn-row"><button class="btn btn-primary" id="s1Next">Continue ➜</button></div>
  </div>
  <div class="card" id="s1CheckCard" style="display:none;">
    <div class="stage-header" style="margin-bottom:10px;">
      <h2 style="font-size:1.2rem;">🎯 Quick Check</h2>
      <p>Can you make pairs?</p>
    </div>
    <div class="emoji-pair-row" id="s1CheckRow" style="font-size:1.7rem;"></div>
    <div class="yesno-row">
      <button class="yesno-btn" id="s1Yes">YES → EVEN</button>
      <button class="yesno-btn" id="s1No">NO → ODD</button>
    </div>

function handleS9(pickEven){

}

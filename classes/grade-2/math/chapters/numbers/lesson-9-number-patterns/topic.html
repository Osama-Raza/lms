<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Lesson 9: Number Patterns — Grade 2 Math</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --pink-1:#fff3f7;
    --pink-2:#ffe1ec;
    --berry-1:#e94f8a;
    --berry-2:#c22a68;
    --berry-dark:#8f1c4f;
    --butter:#ffcf5c;
    --butter-dark:#e6a800;
    --mint:#4fd6a8;
    --sky:#5aa9ff;
    --ink:#4a1030;
    --shadow: 0 10px 24px rgba(196,42,104,.18);
    --radius-lg: 26px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:'Nunito',sans-serif;
    background:
      radial-gradient(circle at 10% 10%, var(--pink-2) 0%, transparent 45%),
      radial-gradient(circle at 90% 20%, #ffe9d6 0%, transparent 40%),
      linear-gradient(180deg, var(--pink-1), #fff);
    color:var(--ink);
    min-height:100vh;
    overflow-x:hidden;
  }
  h1,h2,h3,.display{font-family:'Fredoka',sans-serif;}
  button{font-family:'Nunito',sans-serif;cursor:pointer;border:none;}

  .topbar{
    position:sticky;top:0;z-index:50;
    background:linear-gradient(135deg,var(--berry-1),var(--berry-2));
    color:#fff;padding:10px 16px;
    box-shadow:0 4px 14px rgba(143,28,79,.25);
  }
  .topbar-inner{max-width:900px;margin:0 auto;display:flex;align-items:center;gap:12px;}
  .topbar .lesson-title{font-family:'Fredoka';font-weight:600;font-size:1.05rem;flex:1;}
  .topbar .lesson-title small{display:block;font-family:'Nunito';font-weight:700;font-size:.68rem;opacity:.85;letter-spacing:.04em;text-transform:uppercase;}
  .stars-count{background:rgba(255,255,255,.18);border-radius:20px;padding:5px 12px;font-weight:800;font-size:.85rem;display:flex;align-items:center;gap:4px;}
  .back-btn{
    display:inline-flex;align-items:center;gap:4px;flex-shrink:0;
    background:rgba(255,255,255,.18);color:#fff;text-decoration:none;
    font-family:'Fredoka';font-weight:700;font-size:.8rem;
    padding:7px 14px;border-radius:20px;transition:background .15s ease;
  }
  .back-btn:hover{background:rgba(255,255,255,.3);}

  .progress-track{max-width:900px;margin:8px auto 0;display:flex;gap:3px;padding:0 16px;}
  .progress-dot{flex:1;height:6px;border-radius:6px;background:rgba(255,255,255,.28);transition:background .3s ease;}
  .progress-dot.done{background:var(--butter);}
  .progress-dot.active{background:#fff;}

  .stage-wrap{max-width:780px;margin:0 auto;padding:22px 16px 90px;min-height:70vh;}
  .stage{display:none;animation:fadeUp .45s ease both;}
  .stage.active{display:block;}
  @keyframes fadeUp{from{opacity:0;transform:translateY(14px);}to{opacity:1;transform:translateY(0);}}

  .stage-header{text-align:center;margin-bottom:18px;}
  .stage-eyebrow{
    display:inline-flex;align-items:center;gap:6px;
    background:var(--pink-2);color:var(--berry-dark);
    font-weight:800;font-size:.72rem;letter-spacing:.05em;text-transform:uppercase;
    padding:5px 14px;border-radius:20px;margin-bottom:8px;
  }
  .stage-header h2{font-size:1.4rem;margin:0 0 4px;color:var(--berry-dark);}
  .stage-header p{margin:0;font-weight:700;color:#7a3a5a;font-size:.9rem;}

  .card{background:#fff;border-radius:var(--radius-lg);box-shadow:var(--shadow);padding:22px;border:3px solid var(--pink-2);}

  .audio-btn{
    background:linear-gradient(135deg,var(--sky),#2f7fe0);color:#fff;font-weight:800;font-size:.85rem;
    padding:10px 18px;border-radius:30px;display:inline-flex;align-items:center;gap:8px;
    box-shadow:0 6px 14px rgba(47,127,224,.3);transition:transform .15s ease;
  }
  .audio-btn:active{transform:scale(.94);}
  .audio-btn.small{padding:7px 14px;font-size:.78rem;}
  .audio-btn .icon{font-size:1.1rem;}

  .row-center{display:flex;justify-content:center;align-items:center;gap:10px;flex-wrap:wrap;}

  .btn{font-weight:800;font-size:.95rem;padding:12px 26px;border-radius:30px;transition:transform .15s ease, box-shadow .15s ease;}
  .btn:active{transform:scale(.96);}
  .btn-primary{background:linear-gradient(135deg,var(--berry-1),var(--berry-2));color:#fff;box-shadow:0 8px 18px rgba(196,42,104,.3);}
  .btn-primary[disabled]{opacity:.4;pointer-events:none;}
  .center-btn-row{display:flex;justify-content:center;gap:10px;margin-top:18px;flex-wrap:wrap;}

  .feedback{text-align:center;font-weight:800;font-family:'Fredoka';font-size:1.02rem;min-height:1.6rem;margin-top:12px;}
  .feedback.good{color:#1a8a63;}
  .feedback.bad{color:#c23c3c;}
  .feedback.neutral{color:var(--berry-dark);}
  .q-progress{text-align:center;font-weight:800;color:#a85778;font-size:.78rem;margin-bottom:6px;letter-spacing:.03em;text-transform:uppercase;}

  /* ---------- Hop / number sequence reveal ---------- */
  .hop-sequence{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:8px;margin:16px 0;}
  .hop-chip{
    display:flex;flex-direction:column;align-items:center;gap:2px;
    opacity:0;transform:translateY(10px) scale(.8);transition:opacity .35s ease, transform .35s ease;
  }
  .hop-chip.show{opacity:1;transform:translateY(0) scale(1);}
  .hop-chip .hop-emoji{font-size:1.6rem;}
  .hop-chip .hop-num{font-family:'Fredoka';font-weight:700;color:var(--berry-dark);background:var(--pink-1);border:2px solid var(--pink-2);border-radius:10px;padding:4px 10px;font-size:1.1rem;}
  .hop-arrow{color:#c98cae;font-family:'Fredoka';font-weight:700;font-size:1.2rem;}

  .rule-badge{
    display:inline-flex;align-items:center;gap:8px;
    padding:10px 22px;border-radius:30px;font-family:'Fredoka';font-weight:700;font-size:1.1rem;
    margin:10px 0;background:#e3fbf3;color:#1a8a63;
    opacity:0;transform:scale(.85);transition:opacity .4s ease, transform .4s ease;
  }
  .rule-badge.show{opacity:1;transform:scale(1);}

  /* ---------- Apple groups (What Changed?) ---------- */
  .group-row{display:flex;flex-wrap:wrap;justify-content:center;gap:16px;margin:16px 0;}
  .apple-group{
    display:flex;flex-direction:column;align-items:center;gap:6px;
    opacity:0;transform:translateY(10px);transition:opacity .4s ease, transform .4s ease;
  }
  .apple-group.show{opacity:1;transform:translateY(0);}
  .apple-group .apples{display:flex;flex-wrap:wrap;justify-content:center;gap:2px;max-width:130px;font-size:1.2rem;}
  .apple-group .group-total{font-family:'Fredoka';font-weight:700;color:var(--berry-dark);background:var(--pink-1);border:2px solid var(--pink-2);border-radius:10px;padding:3px 10px;font-size:1rem;}

  /* ---------- Sequence with blank ---------- */
  .num-sequence{
    display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin:16px 0;
    font-family:'Fredoka';font-weight:700;font-size:1.5rem;color:var(--berry-dark);
  }
  .num-sequence span{background:var(--pink-1);border:2px solid var(--pink-2);border-radius:12px;padding:8px 14px;min-width:44px;text-align:center;}
  .num-sequence span.blank{background:var(--butter);border-color:var(--butter-dark);color:#5a3d00;}

  /* ---------- Options ---------- */
  .options{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-top:16px;}
  .opt-btn{
    background:#fff;border:2.5px solid var(--pink-2);color:var(--ink);border-radius:14px;
    padding:14px 8px;font-family:'Fredoka';font-weight:600;font-size:1.1rem;text-align:center;
  }
  .opt-btn:hover{border-color:var(--berry-1);}
  .opt-btn.correct{background:#e3fbf3;border-color:var(--mint);color:#1a8a63;}
  .opt-btn.wrong{background:#ffe9e9;border-color:#f08a8a;color:#c23c3c;}
  .opt-btn.selected{background:var(--pink-2);border-color:var(--berry-1);color:var(--berry-dark);}
  .opt-btn[disabled]{pointer-events:none;}

  /* ---------- Robot scene ---------- */
  .robot-scene{text-align:center;margin:16px 0;}
  .robot-scene .robot-emoji{font-size:3.4rem;}
  .robot-rule{
    display:inline-block;margin-top:6px;font-family:'Fredoka';font-weight:700;font-size:1.15rem;
    background:var(--pink-1);border:2px solid var(--pink-2);border-radius:14px;padding:8px 18px;color:var(--berry-dark);
  }

  /* ---------- Order tap (Pattern Garden) ---------- */
  .order-slots{display:flex;justify-content:center;align-items:center;gap:8px;margin:16px 0;flex-wrap:wrap;}
  .order-slot{
    min-width:56px;height:50px;border:2.5px dashed #f3b8d0;border-radius:14px;
    display:flex;align-items:center;justify-content:center;
    font-family:'Fredoka';font-weight:700;font-size:1.05rem;color:#c98cae;background:#fff8fb;
  }
  .order-slot.filled{border-style:solid;border-color:var(--mint);background:#e3fbf3;color:#1a8a63;}
  .order-arrow{color:#c98cae;font-family:'Fredoka';font-weight:700;font-size:1rem;}
  .stone-row{display:flex;flex-wrap:wrap;justify-content:center;gap:12px;margin-top:14px;}
  .stone-tile{
    display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;
    padding:10px 14px;border-radius:14px;background:#fff8fb;border:3px solid var(--pink-2);
    transition:transform .15s ease, border-color .15s ease;
  }
  .stone-tile:hover{transform:scale(1.05);border-color:var(--berry-1);}
  .stone-tile.locked{opacity:0;pointer-events:none;}
  .stone-tile .stone-emoji{font-size:1.4rem;}
  .stone-tile .stone-num{font-family:'Fredoka';font-weight:700;color:var(--berry-dark);}
  .stone-tile.wrong-flash{background:#ffe9e9;border-color:#f08a8a;}

  /* ---------- Clap sequence ---------- */
  .clap-sequence{display:flex;flex-wrap:wrap;justify-content:center;gap:14px;margin:16px 0;}
  .clap-chip{
    display:flex;flex-direction:column;align-items:center;gap:2px;
    opacity:0;transform:scale(.7);transition:opacity .3s ease, transform .3s ease;
  }
  .clap-chip.show{opacity:1;transform:scale(1);}
  .clap-chip .clap-emoji{font-size:1.6rem;}
  .clap-chip .clap-num{font-family:'Fredoka';font-weight:700;color:var(--berry-dark);background:var(--pink-1);border:2px solid var(--pink-2);border-radius:10px;padding:3px 10px;}

  /* ---------- Falling / catch numbers ---------- */
  .catch-field{display:flex;flex-wrap:wrap;justify-content:center;gap:14px;margin:18px 0;}
  .catch-num{
    width:64px;height:64px;border-radius:50%;display:flex;align-items:center;justify-content:center;
    font-family:'Fredoka';font-weight:700;font-size:1.2rem;color:#fff;cursor:pointer;
    background:linear-gradient(135deg,var(--sky),#2f7fe0);box-shadow:0 4px 0 rgba(0,0,0,.12);
    transition:transform .15s ease;
  }
  .catch-num:hover{transform:scale(1.08);}
  .catch-num.caught{background:linear-gradient(135deg,var(--mint),#1a8a63);pointer-events:none;}
  .catch-num.wrong-flash{outline:3px solid #c23c3c;}

  /* ---------- Rule-pick buttons (Mystery Pattern) ---------- */
  .rule-pick-row{display:flex;justify-content:center;gap:12px;margin-top:16px;flex-wrap:wrap;}
  .rule-pick-btn{
    padding:12px 22px;border-radius:16px;font-family:'Fredoka';font-weight:700;font-size:1.2rem;
    background:#fff;border:2.5px solid var(--pink-2);color:var(--berry-dark);
  }
  .rule-pick-btn:hover{border-color:var(--berry-1);}
  .rule-pick-btn.correct{background:#e3fbf3;border-color:var(--mint);color:#1a8a63;}
  .rule-pick-btn.wrong{background:#ffe9e9;border-color:#f08a8a;color:#c23c3c;}
  .rule-pick-btn[disabled]{pointer-events:none;}

  .stars-row{display:flex;justify-content:center;gap:4px;margin:6px 0;}
  .star-icon{font-size:1.3rem;}

  .reward-card{text-align:center;padding:36px 22px;background:linear-gradient(160deg,#fff,var(--pink-1));}
  .badge-circle{
    width:130px;height:130px;border-radius:50%;margin:0 auto 16px;
    background:linear-gradient(135deg,var(--butter),var(--butter-dark));
    display:flex;align-items:center;justify-content:center;font-size:3.4rem;
    box-shadow:0 14px 26px rgba(230,168,0,.4);border:6px solid #fff;
  }
  .reward-card h2{color:var(--berry-dark);font-size:1.7rem;margin:0 0 4px;}
  .reward-card p{color:#7a3a5a;font-weight:700;margin:0 0 10px;}
  .chapter-complete{
    margin-top:24px;background:#fff8fb;border:2.5px solid var(--pink-2);border-radius:20px;padding:20px;text-align:left;
  }
  .chapter-complete h3{text-align:center;font-size:1.15rem;color:var(--berry-dark);margin:0 0 14px;}
  .chapter-checklist{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:8px;}
  .chapter-checklist li{
    display:flex;align-items:center;gap:10px;font-family:'Fredoka';font-weight:600;color:var(--berry-dark);
    background:#e3fbf3;border-radius:12px;padding:8px 14px;font-size:.95rem;
  }
  .chapter-checklist li .check{color:#1a8a63;font-size:1.1rem;}
  .next-lesson-card{
    margin-top:18px;background:#fff;border:2.5px solid var(--pink-2);border-radius:18px;
    padding:16px;display:flex;align-items:center;gap:14px;text-align:left;
  }
  .next-lesson-card .lock-icon{font-size:1.6rem;}
  .next-lesson-card .txt small{display:block;color:#a85778;font-weight:800;font-size:.7rem;letter-spacing:.04em;text-transform:uppercase;}
  .next-lesson-card .txt strong{font-family:'Fredoka';color:var(--berry-dark);font-size:1.05rem;}

  @media (max-width:480px){
    .options{grid-template-columns:1fr 1fr;}
    .catch-num{width:54px;height:54px;font-size:1rem;}
    .num-sequence{font-size:1.2rem;}
    .num-sequence span{padding:6px 10px;}
  }
  @media (prefers-reduced-motion: reduce){ .stage{animation:none;} }
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-inner">
    <a class="back-btn" href="../lessons.html">&larr; Chapter</a>
    <div class="lesson-title">
      <small>Grade 2 · Math · Chapter 1: Numbers</small>
      🔢 Lesson 9: Number Patterns
    </div>
    <div class="stars-count"><span id="starTotal">0</span> ⭐</div>
  </div>
  <div class="progress-track" id="progressTrack"></div>
</div>

<div class="stage-wrap" id="stageWrap"></div>

<script>
/* ============================================================
   LESSON 9: NUMBER PATTERNS — self-contained, no shared engine.js.
   Final lesson of Chapter 1: Numbers — reward screen shows the
   full chapter checklist and unlocks the Chapter 1 Numbers
   Challenge rather than a single next lesson.

   Progress saved via ../../../../../../assets/js/progress.js
   (falls back to local localStorage if that file is unavailable)

   Carried-forward fixes from earlier lessons:
   - speakForStage() guard against the multi-voice overlap bug —
     a stage may only narrate itself while it is the visible one.
   - stageEnterActions registry (added in Lesson 8): every stage
     whose opening line would otherwise only ever be attempted at
     page-load time (before it's ever shown) registers a callback
     that goToStage() fires exactly once, the moment the stage
     actually becomes active. Without this, most activities after
     the first would open silently.
   - Retry-until-correct on MCQ/tap activities outside Practice.
   - Quick Practice: intro alert screen, no live right/wrong
     reveal per question, score + stars revealed only at the end.
   - Explicit, concrete instructions everywhere (per Lesson 7
     feedback) — no vague "How many?"-style prompts.
   - Tap-based interactions only — no hand-rolled drag.
============================================================ */
const TOPIC_ID = "grade2-math-ch1-lesson9-number-patterns";
let totalStars = 0;

(function loadProgressHelper(){
  try{
    const s = document.createElement('script');
    s.src = "../../../../../../assets/js/progress.js";
    document.head.appendChild(s);
  }catch(e){ /* no-op: local fallback below still works */ }
})();
function saveStepDone(step){
  try{
    if (typeof setStepDone === 'function'){ setStepDone(TOPIC_ID, step, true); return; }
  }catch(e){}
  try{
    const key = 'progress:' + TOPIC_ID;
    const data = JSON.parse(localStorage.getItem(key) || '{}');
    data[step] = true;
    localStorage.setItem(key, JSON.stringify(data));
  }catch(e){ /* storage unavailable — fail silently, never block the lesson */ }
}

/* ---------------- Speech ---------------- */
let enVoice = null;
function pickVoice(){
  const voices = speechSynthesis.getVoices();
  enVoice = voices.find(v => v.lang === 'en-IN') ||
            voices.find(v => v.lang && v.lang.startsWith('en')) || null;
}
if ('speechSynthesis' in window){
  pickVoice();
  speechSynthesis.onvoiceschanged = pickVoice;
}
function speak(text){
  try{
    if (!('speechSynthesis' in window)) return;
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    if (enVoice) u.voice = enVoice;
    u.rate = 0.88;
    u.lang = 'en-IN';
    speechSynthesis.speak(u);
  }catch(e){ /* speech unavailable — visuals still work */ }
}
function isStageActive(stageId){
  const el = document.getElementById(stageId);
  return !!(el && el.classList.contains('active'));
}
function speakForStage(stageId, text){
  if (isStageActive(stageId)) speak(text);
}

function addStar(n=1){
  totalStars += n;
  document.getElementById('starTotal').textContent = totalStars;
}
function shuffled(arr){ return [...arr].sort(() => Math.random() - 0.5); }

/* ---------------- Stage machine ---------------- */
const STAGES = [
  {id:'s1'},   // watch the pattern (2 demos)
  {id:'s2'},   // quick try
  {id:'s3'},   // what changed? (objects)
  {id:'s4'},   // pattern detective (2 rounds)
  {id:'s5'},   // missing tile (3 rounds)
  {id:'s6'},   // pattern robot (demo + quiz)
  {id:'s7'},   // pattern garden (2 rounds tap-in-order)
  {id:'s8'},   // clap the pattern (demo + quiz)
  {id:'s9'},   // catch the correct number (2 rounds)
  {id:'s10'},  // quick practice (6 questions)
  {id:'s11'},  // super challenge (4 challenges incl. mystery)
  {id:'reward'},
];
let currentStageIndex = 0;

function renderProgressTrack(){
  const track = document.getElementById('progressTrack');
  track.innerHTML = '';
  STAGES.forEach((st, i) => {
    const d = document.createElement('div');
    d.className = 'progress-dot' + (i < currentStageIndex ? ' done' : '') + (i === currentStageIndex ? ' active' : '');
    track.appendChild(d);
  });
}
const stageEnterActions = {};
function goToStage(index){
  currentStageIndex = index;
  document.querySelectorAll('.stage').forEach(el => el.classList.remove('active'));
  const target = document.getElementById(STAGES[index].id);
  if (target) target.classList.add('active');
  renderProgressTrack();
  saveStepDone(STAGES[index].id);
  window.scrollTo({top:0, behavior:'smooth'});
  const enterAction = stageEnterActions[STAGES[index].id];
  if (enterAction) enterAction();
}
function completeStage(){
  if (currentStageIndex < STAGES.length - 1) goToStage(currentStageIndex + 1);
}

const wrap = document.getElementById('stageWrap');

/* ---------------- shared MCQ helper (retry-until-correct) ---------------- */
function renderRetryOptions(container, options, answer, onCorrect, onWrongExtra){
  container.innerHTML = '';
  shuffled(options).forEach(opt => {
    const b = document.createElement('button');
    b.className = 'opt-btn';
    b.textContent = opt;
    b.onclick = () => {
      if (b.disabled) return;
      if (String(opt) === String(answer)){
        container.querySelectorAll('.opt-btn').forEach(x => x.disabled = true);
        b.classList.add('correct');
        onCorrect(b);
      } else {
        b.classList.add('wrong');
        b.disabled = true;
        if (onWrongExtra) onWrongExtra();
      }
    };
    container.appendChild(b);
  });
}
function wireRetryFeedback(containerId, feedbackId){
  document.querySelectorAll(`#${containerId} .opt-btn`).forEach(b => {
    const orig = b.onclick;
    b.onclick = (e) => {
      orig(e);
      if (b.classList.contains('wrong')){
        const fb = document.getElementById(feedbackId);
        fb.textContent = 'Try again, you are very close!';
        fb.className = 'feedback bad';
        speak('Try again, you are very close!');
      }
    };
  });
}

/* ============================================================
   PART 1 — Watch the Pattern (two demo sequences)
============================================================ */
const s1Demos = [
  {nums:[2,4,6,8,10], say:'Look! The numbers go up by 2.', badge:'Going up by 2!'},
  {nums:[5,10,15,20], say:'The numbers go up by 5.', badge:'Going up by 5!'},
];
let s1Step = 0;
wrap.insertAdjacentHTML('beforeend', `
<section class="stage" id="s1">
  <div class="stage-header">
    <div class="stage-eyebrow">Activity 1 · Watch the Pattern</div>
    <h2>🔢 Follow the Number Path</h2>
    <p>Watch each number jump.</p>
  </div>
  <div class="card">
    <div class="hop-sequence" id="s1Hops"></div>
    <div class="rule-badge" id="s1Badge"></div>
    <div class="row-center"><button class="audio-btn small" id="s1Listen"><span class="icon">🔊</span> Listen Again</button></div>
    <div class="center-btn-row"><button class="btn btn-primary" id="s1Next">Continue ➜</button></div>
  </div>
</section>`);
function renderS1(){
  const d = s1Demos[s1Step];
  const hopsWrap = document.getElementById('s1Hops');
  hopsWrap.innerHTML = '';
  d.nums.forEach((n, i) => {
    if (i > 0){
      const arrow = document.createElement('span');
      arrow.className = 'hop-arrow';
      arrow.textContent = '→';
      hopsWrap.appendChild(arrow);
    }
    const chip = document.createElement('div');
    chip.className = 'hop-chip';
    chip.innerHTML = `<span class="hop-emoji">🔵</span><span class="hop-num">${n}</span>`;
    hopsWrap.appendChild(chip);
  });
  document.getElementById('s1Badge').className = 'rule-badge';
  document.getElementById('s1Badge').textContent = d.badge;
}
function playS1Sequence(){
  const chips = document.querySelectorAll('#s1Hops .hop-chip');
  chips.forEach(c => c.classList.remove('show'));

  <div class="card" id="s11ChallengeCard">
    <div class="q-progress" id="s11Progress"></div>
    <div class="num-sequence" id="s11Seq"></div>
    <div class="row-center"><button class="audio-btn small" id="s11Play"><span class="icon">🔊</span> Hear It Again</button></div>
    <div class="options" id="s11Options"></div>
    <div class="feedback" id="s11Feedback"></div>
  </div>
  <div class="card" id="s11MysteryCard" style="display:none;">
    <p style="text-align:center;font-weight:700;color:#7a3a5a;">Look at the pattern below. What is the rule?</p>
    <div class="num-sequence"><span>5</span><span>10</span><span>15</span><span>20</span><span class="blank">?</span><span>30</span></div>
    <div class="row-center"><button class="audio-btn small" id="s11MysteryPlay"><span class="icon">🔎</span> Hear It Again</button></div>
    <div id="s11RuleStep">
      <div class="rule-pick-row" id="s11RuleOptions"></div>
    </div>
    <div id="s11NumberStep" style="display:none;">
      <p style="text-align:center;font-weight:700;color:#7a3a5a;margin-top:14px;">Great! Now find the missing number.</p>
      <div class="options" id="s11NumberOptions"></div>
    </div>
    <div class="feedback" id="s11MysteryFeedback"></div>
  </div>
</section>`);
function renderS11Challenge(){
  const r = s11Challenges[s11Index];
  document.getElementById('s11Sub').textContent = `Challenge ${s11Index+1} of ${s11Challenges.length + 1}`;
  document.getElementById('s11Progress').textContent = `Challenge ${s11Index+1} of ${s11Challenges.length + 1}`;
  document.getElementById('s11Feedback').textContent = '';
  const seqWrap = document.getElementById('s11Seq');
  seqWrap.innerHTML = '';
  r.sequence.forEach(n => {
    const el = document.createElement('span');
    el.textContent = n;
    if (n === '?') el.classList.add('blank');
    seqWrap.appendChild(el);
  });
  document.getElementById('s11Play').onclick = () => speak(r.say);
  renderRetryOptions(document.getElementById('s11Options'), r.options, r.answer, () => {
    const fb = document.getElementById('s11Feedback');
    fb.textContent = 'Correct! 🎉';
    fb.className = 'feedback good';
    addStar(1);
    speak('Correct! ' + r.answer + '!');
    setTimeout(() => {
      s11Index++;
      if (s11Index >= s11Challenges.length){
        document.getElementById('s11ChallengeCard').style.display = 'none';
        document.getElementById('s11MysteryCard').style.display = 'block';
        document.getElementById('s11Title').textContent = '🕵️ Mystery Pattern';
        setupS11Mystery();
      } else {
        renderS11Challenge();
      }
    }, 1400);
  });
  wireRetryFeedback('s11Options', 's11Feedback');
}
renderS11Challenge();
stageEnterActions.s11 = () => speak(s11Challenges[s11Index] ? s11Challenges[s11Index].say : 'What is the rule of this pattern?');
function setupS11Mystery(){
  const mysterySay = '5, 10, 15, 20, blank, 30. What is the rule?';
  speakForStage('s11', mysterySay);
  document.getElementById('s11MysteryPlay').onclick = () => speak(mysterySay);
  const ruleWrap = document.getElementById('s11RuleOptions');
  ruleWrap.innerHTML = '';
  shuffled(['+2','+5','+10']).forEach(rule => {
    const b = document.createElement('button');
    b.className = 'rule-pick-btn';
    b.textContent = rule;
    b.onclick = () => {
      if (b.disabled) return;
      const fb = document.getElementById('s11MysteryFeedback');
      if (rule === '+5'){
        document.querySelectorAll('#s11RuleOptions .rule-pick-btn').forEach(x => x.disabled = true);
        b.classList.add('correct');
        fb.textContent = "You found the rule! It's plus 5. 🎉";
        fb.className = 'feedback good';
        addStar(1);
        speak("You found the rule! It's plus 5.");
        setTimeout(() => {
          document.getElementById('s11NumberStep').style.display = 'block';
          fb.textContent = '';
          renderRetryOptions(document.getElementById('s11NumberOptions'), [22,25,28], 25, () => {
            const fb2 = document.getElementById('s11MysteryFeedback');
            fb2.textContent = 'Correct! The missing number is 25! 🎉';
            fb2.className = 'feedback good';
            addStar(1);
            speak('Correct! The missing number is 25!');
            setTimeout(() => showReward(), 1600);
          });
          wireRetryFeedback('s11NumberOptions', 's11MysteryFeedback');
        }, 1300);
      } else {
        b.classList.add('wrong');
        b.disabled = true;
        fb.textContent = 'Try again, you are very close!';
        fb.className = 'feedback bad';
        speak('Try again, you are very close!');
      }
    };
    ruleWrap.appendChild(b);
  });
}

/* ============================================================
   REWARD — Pattern Master + Chapter 1 Complete
============================================================ */
const chapterLessons = [
  'Numbers to 1000', 'Number Names', 'Expanded Form', 'Place Value',
  'Compare Numbers', 'Ascending & Descending', 'Even & Odd',
  'Skip Counting', 'Number Patterns',
];
wrap.insertAdjacentHTML('beforeend', `
<section class="stage" id="reward">
  <div class="card reward-card">
    <div class="badge-circle">🔢</div>
    <h2>PATTERN MASTER</h2>
    <p>You found the patterns!</p>
    <div class="stars-row" id="rewardStars"></div>
    <div class="chapter-complete">
      <h3>🌟 Chapter 1 Complete!</h3>
      <ul class="chapter-checklist" id="chapterChecklist"></ul>
    </div>
    <div class="next-lesson-card">
      <div class="lock-icon">🔓</div>
      <div class="txt">
        <small>Next Up</small>
        <strong>Chapter 1 Numbers Challenge</strong>
      </div>
    </div>
  </div>
</section>`);
function showReward(){
  goToStage(STAGES.length - 1);
  const starsRow = document.getElementById('rewardStars');
  starsRow.innerHTML = '';
  for (let i=0;i<5;i++){
    const s = document.createElement('span');
    s.className = 'star-icon';
    s.textContent = '⭐';
    starsRow.appendChild(s);
  }
  const checklist = document.getElementById('chapterChecklist');
  checklist.innerHTML = '';
  chapterLessons.forEach(name => {
    const li = document.createElement('li');
    li.innerHTML = `<span class="check">✅</span> ${name}`;
    checklist.appendChild(li);
  });
  saveStepDone('lesson9-complete');
  saveStepDone('chapter1-complete');
  speak('Great job! You found the patterns! Chapter 1 is complete!');
}

/* ---------------- init ---------------- */
renderProgressTrack();
goToStage(0);
</script>

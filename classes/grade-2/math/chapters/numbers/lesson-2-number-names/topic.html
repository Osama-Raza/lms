<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Lesson 2: Number Names — Grade 2 Math</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --pink-1:#fff3f7;
    --pink-2:#ffe1ec;
    --berry-1:#e94f8a;
    --berry-2:#c22a68;
    --berry-dark:#8f1c4f;
    --butter:#ffcf5c;
    --butter-dark:#e6a800;
    --mint:#4fd6a8;
    --sky:#5aa9ff;
    --ink:#4a1030;
    --white:#ffffff;
    --shadow: 0 10px 24px rgba(196,42,104,.18);
    --radius-lg: 26px;
    --radius-md: 18px;
    --radius-sm: 12px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:'Nunito',sans-serif;
    background:
      radial-gradient(circle at 10% 10%, var(--pink-2) 0%, transparent 45%),
      radial-gradient(circle at 90% 20%, #ffe9d6 0%, transparent 40%),
      linear-gradient(180deg, var(--pink-1), #fff);
    color:var(--ink);
    min-height:100vh;
    overflow-x:hidden;
  }
  h1,h2,h3,.display{font-family:'Fredoka',sans-serif;}
  button{font-family:'Nunito',sans-serif;cursor:pointer;border:none;}

  /* ---------- Topbar ---------- */
  .topbar{
    position:sticky;top:0;z-index:50;
    background:linear-gradient(135deg,var(--berry-1),var(--berry-2));
    color:#fff;
    padding:10px 16px;
    box-shadow:0 4px 14px rgba(143,28,79,.25);
  }
  .topbar-inner{max-width:900px;margin:0 auto;display:flex;align-items:center;gap:12px;}
  .topbar .lesson-title{font-family:'Fredoka';font-weight:600;font-size:1.05rem;flex:1;}
  .topbar .lesson-title small{display:block;font-family:'Nunito';font-weight:700;font-size:.68rem;opacity:.85;letter-spacing:.04em;text-transform:uppercase;}
  .stars-count{background:rgba(255,255,255,.18);border-radius:20px;padding:5px 12px;font-weight:800;font-size:.85rem;display:flex;align-items:center;gap:4px;}
  .back-btn{
    display:inline-flex;align-items:center;gap:4px;flex-shrink:0;
    background:rgba(255,255,255,.18);color:#fff;text-decoration:none;
    font-family:'Fredoka';font-weight:700;font-size:.8rem;
    padding:7px 14px;border-radius:20px;transition:background .15s ease;
  }
  .back-btn:hover{background:rgba(255,255,255,.3);}

  .progress-track{
    max-width:900px;margin:8px auto 0;
    display:flex;gap:4px;padding:0 16px;
  }
  .progress-dot{
    flex:1;height:7px;border-radius:6px;background:rgba(255,255,255,.28);
    transition:background .3s ease;
  }
  .progress-dot.done{background:var(--butter);}
  .progress-dot.active{background:#fff;}

  /* ---------- Layout ---------- */
  .stage-wrap{max-width:780px;margin:0 auto;padding:22px 16px 90px;min-height:70vh;}
  .stage{display:none;animation:fadeUp .45s ease both;}
  .stage.active{display:block;}
  @keyframes fadeUp{from{opacity:0;transform:translateY(14px);}to{opacity:1;transform:translateY(0);}}

  .stage-header{text-align:center;margin-bottom:18px;}
  .stage-eyebrow{
    display:inline-flex;align-items:center;gap:6px;
    background:var(--pink-2);color:var(--berry-dark);
    font-weight:800;font-size:.75rem;letter-spacing:.05em;text-transform:uppercase;
    padding:5px 14px;border-radius:20px;margin-bottom:8px;
  }
  .stage-header h2{font-size:1.5rem;margin:0 0 4px;color:var(--berry-dark);}
  .stage-header p{margin:0;font-weight:700;color:#7a3a5a;font-size:.95rem;}

  .card{
    background:#fff;border-radius:var(--radius-lg);
    box-shadow:var(--shadow);
    padding:22px;
    border:3px solid var(--pink-2);
  }

  /* ---------- Audio button ---------- */
  .audio-btn{
    background:linear-gradient(135deg,var(--sky),#2f7fe0);
    color:#fff;font-weight:800;font-size:.85rem;
    padding:10px 18px;border-radius:30px;
    display:inline-flex;align-items:center;gap:8px;
    box-shadow:0 6px 14px rgba(47,127,224,.3);
    transition:transform .15s ease;
  }
  .audio-btn:active{transform:scale(.94);}
  .audio-btn.small{padding:7px 14px;font-size:.78rem;}
  .audio-btn .icon{font-size:1.1rem;}

  .row-center{display:flex;justify-content:center;align-items:center;gap:10px;flex-wrap:wrap;}

  /* ---------- Number display (Activity 1) ---------- */
  .big-number{
    font-family:'Fredoka';font-weight:700;
    font-size:3.6rem;text-align:center;color:var(--berry-2);
    margin:10px 0 2px;
    text-shadow:0 4px 0 var(--pink-2);
  }
  .number-name-reveal{
    text-align:center;font-family:'Fredoka';font-weight:600;
    font-size:1.5rem;color:var(--butter-dark);
    min-height:1.9rem;margin-bottom:14px;
    opacity:0;transform:translateY(6px);
    transition:opacity .4s ease, transform .4s ease;
  }
  .number-name-reveal.show{opacity:1;transform:translateY(0);}

  .example-dots{display:flex;justify-content:center;gap:6px;margin:14px 0;}
  .example-dots span{width:9px;height:9px;border-radius:50%;background:var(--pink-2);}
  .example-dots span.done{background:var(--berry-1);}
  .example-dots span.current{background:var(--butter-dark);transform:scale(1.3);}

  /* ---------- Buttons general ---------- */
  .btn{
    font-weight:800;font-size:.95rem;padding:12px 26px;border-radius:30px;
    transition:transform .15s ease, box-shadow .15s ease;
  }
  .btn:active{transform:scale(.96);}
  .btn-primary{background:linear-gradient(135deg,var(--berry-1),var(--berry-2));color:#fff;box-shadow:0 8px 18px rgba(196,42,104,.3);}
  .btn-primary[disabled]{opacity:.4;pointer-events:none;}
  .btn-ghost{background:var(--pink-2);color:var(--berry-dark);}
  .center-btn-row{display:flex;justify-content:center;gap:10px;margin-top:18px;flex-wrap:wrap;}

  /* ---------- Match It (drag) ---------- */
  .match-area{display:flex;justify-content:space-between;gap:18px;margin-top:16px;flex-wrap:wrap;}
  .match-col{flex:1;min-width:140px;display:flex;flex-direction:column;gap:12px;}
  .match-col h4{text-align:center;font-family:'Fredoka';color:var(--berry-dark);margin:0 0 6px;font-size:.9rem;text-transform:uppercase;letter-spacing:.04em;}
  .drag-chip{
    touch-action:none;user-select:none;
    background:var(--pink-1);border:2.5px solid var(--berry-1);
    color:var(--berry-dark);font-family:'Fredoka';font-weight:600;
    padding:14px 10px;border-radius:16px;text-align:center;font-size:1.05rem;
    box-shadow:0 4px 0 var(--pink-2);
    position:relative;z-index:5;
  }
  .drag-chip.dragging{box-shadow:0 12px 20px rgba(196,42,104,.35);z-index:100;}
  .drop-slot{
    background:#fff8fb;border:2.5px dashed #f3b8d0;
    border-radius:16px;padding:14px 10px;text-align:center;
    font-family:'Fredoka';font-weight:600;color:#c98cae;font-size:.95rem;
    min-height:54px;display:flex;align-items:center;justify-content:center;
  }
  .drop-slot.filled{border-style:solid;color:var(--berry-dark);background:var(--pink-2);}
  .drop-slot.correct{border-color:var(--mint);background:#e3fbf3;color:#1a8a63;}

  /* ---------- MCQ options ---------- */
  .options{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-top:16px;}
  .options.two-col{grid-template-columns:1fr 1fr;}
  .options.stacked{grid-template-columns:1fr;}
  .opt-btn{
    background:#fff;border:2.5px solid var(--pink-2);color:var(--ink);
    border-radius:14px;padding:14px 8px;font-family:'Fredoka';font-weight:600;
    font-size:1.15rem;text-align:center;
  }
  .opt-btn:hover{border-color:var(--berry-1);}
  .opt-btn.correct{background:#e3fbf3;border-color:var(--mint);color:#1a8a63;}
  .opt-btn.wrong{background:#ffe9e9;border-color:#f08a8a;color:#c23c3c;}
  .opt-btn[disabled]{pointer-events:none;}

  .feedback{
    text-align:center;font-weight:800;font-family:'Fredoka';font-size:1.05rem;
    min-height:1.6rem;margin-top:12px;
  }
  .feedback.good{color:#1a8a63;}
  .feedback.bad{color:#c23c3c;}

  .q-progress{text-align:center;font-weight:800;color:#a85778;font-size:.8rem;margin-bottom:6px;letter-spacing:.03em;text-transform:uppercase;}

  /* ---------- Doors (Number Detective) ---------- */
  .doors-row{display:flex;justify-content:center;gap:16px;margin-top:20px;flex-wrap:wrap;}
  .door{
    width:100px;height:140px;border-radius:14px 14px 8px 8px;
    background:linear-gradient(180deg,#c9793e,#a85a26);
    border:4px solid #7a3c15;
    display:flex;align-items:flex-end;justify-content:center;
    color:#fff5e6;font-family:'Fredoka';font-weight:700;font-size:1.3rem;
    padding-bottom:10px;position:relative;
    box-shadow:0 6px 14px rgba(0,0,0,.2);
  }
  .door::before{content:'';position:absolute;top:18px;width:60%;height:60%;background:rgba(255,255,255,.08);border-radius:8px;}
  .door.shake{animation:shake .4s ease;}
  .door.open{background:linear-gradient(180deg,#4fd6a8,#1a8a63);}
  @keyframes shake{0%,100%{transform:translateX(0);}25%{transform:translateX(-8px);}75%{transform:translateX(8px);}}

  /* ---------- Balloon Pop ---------- */
  .balloon-field{
    position:relative;min-height:340px;border-radius:20px;
    background:linear-gradient(180deg,#eaf6ff,#f8fcff);
    border:2.5px dashed #bfe0ff;overflow:hidden;margin-top:14px;
  }
  .balloon{
    position:absolute;width:88px;height:104px;
    display:flex;align-items:center;justify-content:center;text-align:center;
    border-radius:50% 50% 50% 50% / 58% 58% 42% 42%;
    font-family:'Fredoka';font-weight:700;font-size:.95rem;color:#fff;
    box-shadow:inset 0 -10px 14px rgba(0,0,0,.12);
    animation:floaty 3.6s ease-in-out infinite;
    padding:6px;
  }
  .balloon::after{
    content:'';position:absolute;bottom:-14px;left:50%;transform:translateX(-50%);
    width:2px;height:16px;background:#999;
  }
  .balloon.selected{outline:4px solid #fff;outline-offset:2px;}
  .balloon.popped{animation:none;opacity:0;transform:scale(1.5);pointer-events:none;}
  @keyframes floaty{0%,100%{transform:translateY(0);}50%{transform:translateY(-14px);}}

  /* ---------- Build the number name ---------- */
  .build-target{
    display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin:16px 0;
    min-height:60px;
  }
  .build-slot{
    min-width:70px;height:52px;border:2.5px dashed #f3b8d0;border-radius:12px;
    display:flex;align-items:center;justify-content:center;
    background:#fff8fb;font-family:'Fredoka';font-weight:600;color:var(--berry-dark);
    padding:0 8px;
  }
  .build-slot.filled{border-style:solid;background:var(--pink-2);}
  .build-bank{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:10px;}
  .word-piece{
    touch-action:none;user-select:none;
    background:var(--butter);color:#5a3d00;font-family:'Fredoka';font-weight:700;
    padding:12px 18px;border-radius:14px;font-size:1.05rem;
    box-shadow:0 4px 0 var(--butter-dark);position:relative;z-index:5;
  }
  .word-piece.used{opacity:0;pointer-events:none;}
  .word-piece.dragging{z-index:100;box-shadow:0 10px 18px rgba(0,0,0,.25);}

  /* ---------- Treasure hunt ---------- */
  .chest-row{display:flex;justify-content:center;gap:14px;margin-top:18px;flex-wrap:wrap;}
  .chest{
    width:84px;height:74px;border-radius:10px 10px 6px 6px;
    background:linear-gradient(180deg,#e0a94e,#b9762a);
    border:3px solid #8a541a;
    display:flex;align-items:center;justify-content:center;
    color:#fff8ea;font-family:'Fredoka';font-weight:700;font-size:1.15rem;
    box-shadow:0 6px 12px rgba(0,0,0,.18);position:relative;
  }
  .chest.open{background:linear-gradient(180deg,var(--butter),var(--butter-dark));}
  .chest.shake{animation:shake .4s ease;}
  .chest .lock{position:absolute;top:-8px;font-size:.9rem;}
  .found-count{text-align:center;font-family:'Fredoka';font-weight:700;color:var(--berry-dark);margin-top:14px;font-size:1rem;}

  /* ---------- Stars ---------- */
  .stars-row{display:flex;justify-content:center;gap:4px;margin:6px 0;}
  .star-icon{font-size:1.3rem;filter:grayscale(1) opacity(.35);}
  .star-icon.lit{filter:none;}

  /* ---------- Reward ---------- */
  .reward-card{
    text-align:center;padding:36px 22px;
    background:linear-gradient(160deg,#fff,var(--pink-1));
  }
  .badge-circle{
    width:130px;height:130px;border-radius:50%;margin:0 auto 16px;
    background:linear-gradient(135deg,var(--butter),var(--butter-dark));
    display:flex;align-items:center;justify-content:center;font-size:3.4rem;
    box-shadow:0 14px 26px rgba(230,168,0,.4);
    border:6px solid #fff;
  }
  .reward-card h2{color:var(--berry-dark);font-size:1.7rem;margin:0 0 4px;}
  .reward-card p{color:#7a3a5a;font-weight:700;margin:0 0 10px;}
  .next-lesson-card{
    margin-top:22px;background:#fff;border:2.5px solid var(--pink-2);
    border-radius:18px;padding:16px;display:flex;align-items:center;gap:14px;
    text-align:left;
  }
  .next-lesson-card .lock-icon{font-size:1.6rem;}
  .next-lesson-card .txt small{display:block;color:#a85778;font-weight:800;font-size:.7rem;letter-spacing:.04em;text-transform:uppercase;}
  .next-lesson-card .txt strong{font-family:'Fredoka';color:var(--berry-dark);font-size:1.05rem;}

  @media (max-width:480px){
    .big-number{font-size:2.7rem;}
    .options{grid-template-columns:1fr 1fr;}
    .match-area{gap:10px;}
    .door{width:82px;height:118px;font-size:1.05rem;}
    .balloon{width:76px;height:90px;font-size:.82rem;}
  }
  @media (prefers-reduced-motion: reduce){
    .balloon, .stage{animation:none;}
  }
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-inner">
    <a class="back-btn" href="../lessons.html">&larr; Chapter</a>
    <div class="lesson-title">
      <small>Grade 2 · Math · Chapter 1: Numbers</small>
      🔢 Lesson 2: Number Names
    </div>
    <div class="stars-count"><span id="starTotal">0</span> ⭐</div>
  </div>
  <div class="progress-track" id="progressTrack"></div>
</div>

<div class="stage-wrap" id="stageWrap"></div>

<script>
/* ============================================================
   LESSON 2: NUMBER NAMES — self-contained, no shared engine.js
   Progress saved via ../../../../../../assets/js/progress.js
   (falls back to local localStorage if that file is unavailable)
============================================================ */
const TOPIC_ID = "grade2-math-ch1-lesson2-number-names";
let totalStars = 0;

/* ---- optional shared progress helper (safe if missing) ---- */
let progressHelper = null;
(function loadProgressHelper(){
  try{
    const s = document.createElement('script');
    s.src = "../../../../../../assets/js/progress.js";
    s.onload = () => { progressHelper = window; };
    s.onerror = () => { progressHelper = null; };
    document.head.appendChild(s);
  }catch(e){ progressHelper = null; }
})();
function saveStepDone(step){
  try{
    if (typeof setStepDone === 'function'){ setStepDone(TOPIC_ID, step, true); return; }
  }catch(e){}
  try{
    const key = 'progress:' + TOPIC_ID;
    const data = JSON.parse(localStorage.getItem(key) || '{}');
    data[step] = true;
    localStorage.setItem(key, JSON.stringify(data));
  }catch(e){ /* storage unavailable — fail silently, never block the lesson */ }
}

/* ---------------- Speech ---------------- */
let enVoice = null;
function pickVoice(){
  const voices = speechSynthesis.getVoices();
  enVoice = voices.find(v => v.lang === 'en-IN') ||
            voices.find(v => v.lang && v.lang.startsWith('en')) || null;
}
if ('speechSynthesis' in window){
  pickVoice();
  speechSynthesis.onvoiceschanged = pickVoice;
}
function speak(text){
  try{
    if (!('speechSynthesis' in window)) return;
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    if (enVoice) u.voice = enVoice;
    u.rate = 0.88;
    u.lang = 'en-IN';
    speechSynthesis.speak(u);
  }catch(e){ /* speech unavailable — visuals still work */ }
}

/* ---------------- Star tracking ---------------- */
function addStar(n=1){
  totalStars += n;
  document.getElementById('starTotal').textContent = totalStars;
}
function isStageActive(stageId){
  const el = document.getElementById(stageId);
  return !!(el && el.classList.contains('active'));
}
function speakForStage(stageId, text){
  // All stages are BUILT immediately at page load, but only one is
  // SHOWN — without this guard, every hidden stage's setup-time
  // narration fires anyway and overlaps whatever is on screen.
  if (isStageActive(stageId)) speak(text);
}

/* ---------------- Stage machine ---------------- */
const STAGES = [
  {id:'s1', label:'See & Hear', icon:'👀'},
  {id:'s2', label:'Match It', icon:'🧩'},
  {id:'s3', label:'Listen & Find', icon:'🔊'},
  {id:'s4', label:'Number Detective', icon:'🔎'},
  {id:'s5', label:'Balloon Pop', icon:'🎈'},
  {id:'s6', label:'Build the Name', icon:'🏗️'},
  {id:'s7', label:'Choose the Name', icon:'✏️'},
  {id:'s8', label:'Name → Number', icon:'🧠'},
  {id:'s9', label:'Treasure Hunt', icon:'🗺️'},
  {id:'s10', label:'Mini Challenge', icon:'⭐'},
  {id:'reward', label:'Reward', icon:'🏆'},
];
let currentStageIndex = 0;

function renderProgressTrack(){
  const track = document.getElementById('progressTrack');
  track.innerHTML = '';
  STAGES.forEach((st, i) => {
    const d = document.createElement('div');
    d.className = 'progress-dot' + (i < currentStageIndex ? ' done' : '') + (i === currentStageIndex ? ' active' : '');
    track.appendChild(d);
  });
}

function goToStage(index){
  currentStageIndex = index;
  document.querySelectorAll('.stage').forEach(el => el.classList.remove('active'));
  const target = document.getElementById(STAGES[index].id);
  if (target) target.classList.add('active');
  renderProgressTrack();
  saveStepDone(STAGES[index].id);
  window.scrollTo({top:0, behavior:'smooth'});
}
function completeStage(){
  if (currentStageIndex < STAGES.length - 1) goToStage(currentStageIndex + 1);
}

/* helper to shuffle array (copy) */
function shuffled(arr){ return [...arr].sort(() => Math.random() - 0.5); }

/* number -> words (supports what this lesson needs, up to 999) */
const ONES = ['','one','two','three','four','five','six','seven','eight','nine','ten',
  'eleven','twelve','thirteen','fourteen','fifteen','sixteen','seventeen','eighteen','nineteen'];
const TENS = ['','','twenty','thirty','forty','fifty','sixty','seventy','eighty','ninety'];
function numberToWords(n){
  if (n === 0) return 'zero';
  let out = '';
  const h = Math.floor(n/100), rem = n%100;
  if (h) out += ONES[h] + ' hundred';
  if (rem){
    if (out) out += ' ';
    if (rem < 20) out += ONES[rem];
    else {
      out += TENS[Math.floor(rem/10)];
      if (rem%10) out += '-' + ONES[rem%10];
    }
  }
  return out;
}
function capWords(s){ return s.replace(/(^|\s)([a-z])/g, (m,sp,c) => sp + c.toUpperCase()); }

/* ============================================================
   BUILD EACH STAGE's HTML
============================================================ */
const wrap = document.getElementById('stageWrap');

/* ---------- STAGE 1: See & Hear ---------- */
const s1Examples = [100, 200, 325, 500];
let s1Index = 0;
wrap.insertAdjacentHTML('beforeend', `
<section class="stage" id="s1">
  <div class="stage-header">
    <div class="stage-eyebrow">Activity 1 · See &amp; Hear</div>
    <h2>Say the Number</h2>
    <p>Watch the number, then hear its name.</p>
  </div>
  <div class="card">
    <div class="example-dots" id="s1Dots"></div>
    <div class="big-number" id="s1Number"></div>
    <div class="number-name-reveal" id="s1Name"></div>
    <div class="row-center">
      <button class="audio-btn" id="s1Listen"><span class="icon">🔊</span> Listen Again</button>
    </div>
    <div class="center-btn-row">
      <button class="btn btn-ghost" id="s1Repeat">🔁 Try Again</button>
      <button class="btn btn-primary" id="s1Next">Next ➜</button>
    </div>
  </div>
</section>`);
function renderS1Dots(){
  const dots = document.getElementById('s1Dots');
  dots.innerHTML = s1Examples.map((_,i) =>
    `<span class="${i < s1Index ? 'done' : ''}${i === s1Index ? ' current' : ''}"></span>`).join('');
}
function playS1(){
  const n = s1Examples[s1Index];
  const nameEl = document.getElementById('s1Name');
  document.getElementById('s1Number').textContent = n;
  nameEl.classList.remove('show');
  nameEl.textContent = '';
  renderS1Dots();
  setTimeout(() => {
    const words = capWords(numberToWords(n));
    nameEl.textContent = words;
    nameEl.classList.add('show');
    speakForStage('s1', words);
  }, 550);
}
document.getElementById('s1Listen').onclick = () => speak(capWords(numberToWords(s1Examples[s1Index])));
document.getElementById('s1Repeat').onclick = () => playS1();
document.getElementById('s1Next').onclick = () => {
  s1Index++;
  if (s1Index >= s1Examples.length){
    document.getElementById('s1Next').textContent = 'Continue ➜';
    document.getElementById('s1Next').onclick = () => completeStage();
    s1Index = s1Examples.length - 1;
    renderS1Dots();
    return;
  }
  playS1();
};
playS1();

/* ---------- STAGE 2: Match It (drag) ---------- */
const s2Pairs = [
  {num:125, name:'One hundred twenty-five'},
  {num:250, name:'Two hundred fifty'},
  {num:400, name:'Four hundred'},
];
wrap.insertAdjacentHTML('beforeend', `
<section class="stage" id="s2">
  <div class="stage-header">

    </div>

      <button class="btn btn-primary" id="s2Next" disabled>Next ➜</button>
    </div>
  </div>
</section>`);
(function setupS2(){
  const numsCol = document.getElementById('s2Numbers');
  const namesCol = document.getElementById('s2Names');
  const shuffledNums = shuffled(s2Pairs);
  const shuffledNames = shuffled(s2Pairs);
  let matched = 0;

  shuffledNums.forEach(p => {
    const chip = document.createElement('div');
    chip.className = 'drag-chip';
    chip.textContent = p.num;
    chip.dataset.num = p.num;
    numsCol.appendChild(chip);
    makeDraggable(chip, namesCol);
  });
  shuffledNames.forEach(p => {
    const slot = document.createElement('div');
    slot.className = 'drop-slot';
    slot.textContent = capWords(p.name);
    slot.dataset.num = p.num;
    namesCol.appendChild(slot);
  });

  function makeDraggable(chip, dropContainer){
    let offsetX, offsetY, startParent, startRect;
    chip.addEventListener('pointerdown', (e) => {
      if (chip.classList.contains('locked')) return;
      chip.setPointerCapture(e.pointerId);
      chip.classList.add('dragging');
      startRect = chip.getBoundingClientRect();
      startParent = chip.parentElement;
      document.body.appendChild(chip);
      chip.style.position = 'fixed';
      chip.style.width = startRect.width + 'px';
      chip.style.left = startRect.left + 'px';
      chip.style.top = startRect.top + 'px';
      offsetX = e.clientX - startRect.left;
      offsetY = e.clientY - startRect.top;

      function onMove(ev){
        chip.style.left = (ev.clientX - offsetX) + 'px';
        chip.style.top = (ev.clientY - offsetY) + 'px';
      }
      function onUp(ev){
        chip.removeEventListener('pointermove', onMove);
        chip.removeEventListener('pointerup', onUp);
        chip.classList.remove('dragging');
        const slots = dropContainer.querySelectorAll('.drop-slot:not(.correct)');
        let dropped = null;
        slots.forEach(slot => {
          const r = slot.getBoundingClientRect();
          if (ev.clientX >= r.left && ev.clientX <= r.right && ev.clientY >= r.top && ev.clientY <= r.bottom){
            dropped = slot;
          }
        });
        chip.style.position = '';
        chip.style.left = '';
        chip.style.top = '';
        chip.style.width = '';

        if (dropped){
          if (String(dropped.dataset.num) === String(chip.dataset.num)){
            dropped.classList.add('correct', 'filled');
            dropped.textContent = capWords(dropped.textContent) + '  ✅';
            chip.remove();
            matched++;
            addStar(1);
            document.getElementById('s2Feedback').textContent = 'Great! 🎉';
            document.getElementById('s2Feedback').className = 'feedback good';
            speak('Great job!');
            if (matched === s2Pairs.length){
              document.getElementById('s2Next').disabled = false;
              document.getElementById('s2Feedback').textContent = 'All matched! Well done! 🎉';
            }
          } else {
            startParent.appendChild(chip);
            document.getElementById('s2Feedback').textContent = 'Try again.';
            document.getElementById('s2Feedback').className = 'feedback bad';
            speak('Try again.');
          }
        } else {
          startParent.appendChild(chip);
        }
      }
      chip.addEventListener('pointermove', onMove);
      chip.addEventListener('pointerup', onUp);
    });
  }
})();
document.getElementById('s2Next').onclick = () => completeStage();

  shuffled(q.options).forEach(opt => {
    const b = document.createElement('button');
    b.className = 'opt-btn';
    b.textContent = opt;
    b.onclick = () => handleS10Answer(opt, b);
    optsWrap.appendChild(b);
  });
  setTimeout(() => speakForStage('s10', q.name), 350);
}
function handleS10Answer(opt, btn){
  const q = s10Questions[s10Index];
  document.querySelectorAll('#s10Options .opt-btn').forEach(b => b.disabled = true);
  const fb = document.getElementById('s10Feedback');
  if (opt === q.answer){
    btn.classList.add('correct');
    fb.textContent = 'Excellent! 🎉';
    fb.className = 'feedback good';
    addStar(1);
    s10Correct++;
    speak('Excellent!');
  } else {
    btn.classList.add('wrong');
    fb.textContent = `It was ${q.answer}.`;
    fb.className = 'feedback bad';
    speak('Not quite.');
  }
  setTimeout(() => {
    s10Index++;
    if (s10Index >= s10Questions.length) showReward();
    else renderS10();
  }, 1400);
}
renderS10();

/* ---------- REWARD ---------- */
wrap.insertAdjacentHTML('beforeend', `
<section class="stage" id="reward">
  <div class="card reward-card">
    <div class="badge-circle">🔎</div>
    <h2>NUMBER DETECTIVE</h2>
    <p>You found all the numbers!</p>
    <div class="stars-row" id="rewardStars"></div>
    <div class="next-lesson-card">
      <div class="lock-icon">🔓</div>
      <div class="txt">
        <small>Next Lesson</small>
        <strong>Lesson 3: Expanded Form</strong>
      </div>
    </div>
  </div>
</section>`);
function showReward(){
  goToStage(STAGES.length - 1);
  const starsRow = document.getElementById('rewardStars');
  starsRow.innerHTML = '';
  for (let i=0;i<5;i++){
    const s = document.createElement('span');
    s.className = 'star-icon' + (i < 5 ? ' lit' : '');
    s.textContent = '⭐';
    starsRow.appendChild(s);
  }
  saveStepDone('lesson2-complete');
  speak('Great job! You are a Number Detective!');
}

/* ---------------- init ---------------- */
renderProgressTrack();
goToStage(0);
</script>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Lesson 3: Expanded Form — Grade 2 Math</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --pink-1:#fff3f7;
    --pink-2:#ffe1ec;
    --berry-1:#e94f8a;
    --berry-2:#c22a68;
    --berry-dark:#8f1c4f;
    --butter:#ffcf5c;
    --butter-dark:#e6a800;
    --mint:#4fd6a8;
    --sky:#5aa9ff;
    --ink:#4a1030;
    --white:#ffffff;
    --shadow: 0 10px 24px rgba(196,42,104,.18);
    --radius-lg: 26px;
    --radius-md: 18px;
    --radius-sm: 12px;
    --hund:#5aa9ff;
    --tens:#ffcf5c;
    --ones:#4fd6a8;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:'Nunito',sans-serif;
    background:
      radial-gradient(circle at 10% 10%, var(--pink-2) 0%, transparent 45%),
      radial-gradient(circle at 90% 20%, #ffe9d6 0%, transparent 40%),
      linear-gradient(180deg, var(--pink-1), #fff);
    color:var(--ink);
    min-height:100vh;
    overflow-x:hidden;
  }
  h1,h2,h3,.display{font-family:'Fredoka',sans-serif;}
  button{font-family:'Nunito',sans-serif;cursor:pointer;border:none;}

  /* ---------- Topbar ---------- */
  .topbar{
    position:sticky;top:0;z-index:50;
    background:linear-gradient(135deg,var(--berry-1),var(--berry-2));
    color:#fff;
    padding:10px 16px;
    box-shadow:0 4px 14px rgba(143,28,79,.25);
  }
  .topbar-inner{max-width:900px;margin:0 auto;display:flex;align-items:center;gap:12px;}
  .topbar .lesson-title{font-family:'Fredoka';font-weight:600;font-size:1.05rem;flex:1;}
  .topbar .lesson-title small{display:block;font-family:'Nunito';font-weight:700;font-size:.68rem;opacity:.85;letter-spacing:.04em;text-transform:uppercase;}
  .stars-count{background:rgba(255,255,255,.18);border-radius:20px;padding:5px 12px;font-weight:800;font-size:.85rem;display:flex;align-items:center;gap:4px;}
  .back-btn{
    display:inline-flex;align-items:center;gap:4px;flex-shrink:0;
    background:rgba(255,255,255,.18);color:#fff;text-decoration:none;
    font-family:'Fredoka';font-weight:700;font-size:.8rem;
    padding:7px 14px;border-radius:20px;transition:background .15s ease;
  }
  .back-btn:hover{background:rgba(255,255,255,.3);}

  .progress-track{
    max-width:900px;margin:8px auto 0;
    display:flex;gap:4px;padding:0 16px;
  }
  .progress-dot{
    flex:1;height:7px;border-radius:6px;background:rgba(255,255,255,.28);
    transition:background .3s ease;
  }
  .progress-dot.done{background:var(--butter);}
  .progress-dot.active{background:#fff;}

  /* ---------- Layout ---------- */
  .stage-wrap{max-width:780px;margin:0 auto;padding:22px 16px 90px;min-height:70vh;}
  .stage{display:none;animation:fadeUp .45s ease both;}
  .stage.active{display:block;}
  @keyframes fadeUp{from{opacity:0;transform:translateY(14px);}to{opacity:1;transform:translateY(0);}}

  .stage-header{text-align:center;margin-bottom:18px;}
  .stage-eyebrow{
    display:inline-flex;align-items:center;gap:6px;
    background:var(--pink-2);color:var(--berry-dark);
    font-weight:800;font-size:.75rem;letter-spacing:.05em;text-transform:uppercase;
    padding:5px 14px;border-radius:20px;margin-bottom:8px;
  }
  .stage-header h2{font-size:1.5rem;margin:0 0 4px;color:var(--berry-dark);}
  .stage-header p{margin:0;font-weight:700;color:#7a3a5a;font-size:.95rem;}

  .card{
    background:#fff;border-radius:var(--radius-lg);
    box-shadow:var(--shadow);
    padding:22px;
    border:3px solid var(--pink-2);
  }

  /* ---------- Audio button ---------- */
  .audio-btn{
    background:linear-gradient(135deg,var(--sky),#2f7fe0);
    color:#fff;font-weight:800;font-size:.85rem;
    padding:10px 18px;border-radius:30px;
    display:inline-flex;align-items:center;gap:8px;
    box-shadow:0 6px 14px rgba(47,127,224,.3);
    transition:transform .15s ease;
  }
  .audio-btn:active{transform:scale(.94);}
  .audio-btn.small{padding:7px 14px;font-size:.78rem;}
  .audio-btn .icon{font-size:1.1rem;}

  .row-center{display:flex;justify-content:center;align-items:center;gap:10px;flex-wrap:wrap;}

  /* ---------- Number display ---------- */
  .big-number{
    font-family:'Fredoka';font-weight:700;
    font-size:3.6rem;text-align:center;color:var(--berry-2);
    margin:10px 0 2px;
    text-shadow:0 4px 0 var(--pink-2);
  }
  .equation-row{
    display:flex;justify-content:center;align-items:center;gap:10px;flex-wrap:wrap;
    font-family:'Fredoka';font-weight:700;font-size:1.7rem;margin:14px 0;
  }
  .equation-row .plus{color:#c98cae;font-size:1.4rem;}
  .place-chip{
    padding:10px 18px;border-radius:14px;color:#fff;
    box-shadow:0 4px 0 rgba(0,0,0,.12);
    opacity:0;transform:translateY(10px) scale(.8);
    transition:opacity .4s ease, transform .4s ease;
  }
  .place-chip.show{opacity:1;transform:translateY(0) scale(1);}
  .place-chip.hundreds{background:var(--hund);}
  .place-chip.tens{background:var(--tens);color:#5a3d00;}
  .place-chip.ones{background:var(--ones);}

  .blocks-row{display:flex;justify-content:center;gap:22px;margin:16px 0;flex-wrap:wrap;}
  .block-group{text-align:center;}
  .block-group .label{font-family:'Fredoka';font-weight:700;font-size:.85rem;color:#7a3a5a;margin-bottom:6px;text-transform:uppercase;letter-spacing:.03em;}
  .block-grid{display:flex;flex-wrap:wrap;gap:3px;max-width:110px;justify-content:center;}
  .block-grid.hundreds-grid{max-width:140px;}
  .mini-block{width:16px;height:16px;border-radius:3px;}
  .mini-block.hundreds{background:var(--hund);}
  .mini-block.tens{background:var(--tens);}
  .mini-block.ones{background:var(--ones);border-radius:50%;}
  .hundred-square{width:46px;height:46px;background:var(--hund);border-radius:5px;display:grid;grid-template-columns:repeat(5,1fr);grid-template-rows:repeat(5,1fr);gap:1px;padding:2px;}
  .hundred-square span{background:rgba(255,255,255,.35);border-radius:1px;}
  .ten-rod{width:12px;height:46px;background:var(--tens);border-radius:3px;}

  /* ---------- Buttons ---------- */
  .btn{
    font-weight:800;font-size:.95rem;padding:12px 26px;border-radius:30px;
    transition:transform .15s ease, box-shadow .15s ease;
  }
  .btn:active{transform:scale(.96);}
  .btn-primary{background:linear-gradient(135deg,var(--berry-1),var(--berry-2));color:#fff;box-shadow:0 8px 18px rgba(196,42,104,.3);}
  .btn-primary[disabled]{opacity:.4;pointer-events:none;}
  .btn-ghost{background:var(--pink-2);color:var(--berry-dark);}
  .center-btn-row{display:flex;justify-content:center;gap:10px;margin-top:18px;flex-wrap:wrap;}

  /* ---------- Drag chips / drop slots (generic) ---------- */
  .drag-chip{
    touch-action:none;user-select:none;
    background:var(--pink-1);border:2.5px solid var(--berry-1);
    color:var(--berry-dark);font-family:'Fredoka';font-weight:700;
    padding:14px 16px;border-radius:16px;text-align:center;font-size:1.15rem;
    box-shadow:0 4px 0 var(--pink-2);
    position:relative;z-index:5;
  }
  .drag-chip.dragging{box-shadow:0 12px 20px rgba(196,42,104,.35);z-index:100;}
  .drag-chip.used{opacity:0;pointer-events:none;}
  .drop-slot{
    background:#fff8fb;border:2.5px dashed #f3b8d0;
    border-radius:16px;padding:14px 10px;text-align:center;
    font-family:'Fredoka';font-weight:700;color:#c98cae;font-size:1.15rem;
    min-height:56px;min-width:70px;display:flex;align-items:center;justify-content:center;
  }
  .drop-slot.filled{border-style:solid;color:var(--berry-dark);background:var(--pink-2);}
  .drop-slot.correct{border-color:var(--mint);background:#e3fbf3;color:#1a8a63;}

  /* ---------- Build the Number (Activity 2) ---------- */
  .build-zone{
    display:flex;justify-content:center;align-items:center;gap:10px;flex-wrap:wrap;
    background:#fff8fb;border:2.5px dashed #f3b8d0;border-radius:18px;
    min-height:80px;padding:16px;margin:16px 0;
  }
  .build-zone.filled{border-style:solid;border-color:var(--mint);background:#e3fbf3;}
  .bank-row{display:flex;justify-content:center;gap:14px;flex-wrap:wrap;margin-top:10px;}

  /* ---------- Number Builder (Activity 4) place boxes ---------- */
  .place-boxes{display:flex;justify-content:center;gap:16px;margin:18px 0;flex-wrap:wrap;}
  .place-box-col{text-align:center;}
  .place-box-col h4{font-family:'Fredoka';font-size:.8rem;color:#7a3a5a;text-transform:uppercase;letter-spacing:.04em;margin:0 0 6px;}
  .place-box{
    width:88px;height:64px;border:2.5px dashed #f3b8d0;border-radius:14px;
    display:flex;align-items:center;justify-content:center;
    font-family:'Fredoka';font-weight:700;font-size:1.3rem;color:#c98cae;
    background:#fff8fb;
  }
  .place-box.filled{border-style:solid;background:var(--pink-2);color:var(--berry-dark);}
  .place-box.hundreds-box.filled{border-color:var(--hund);}
  .place-box.tens-box.filled{border-color:var(--tens);}
  .place-box.ones-box.filled{border-color:var(--ones);}
  .result-eq{text-align:center;font-family:'Fredoka';font-weight:700;font-size:1.3rem;color:var(--berry-dark);margin-top:14px;min-height:1.8rem;}

  /* ---------- Match It ---------- */
  .match-area{display:flex;justify-content:space-between;gap:18px;margin-top:16px;flex-wrap:wrap;}
  .match-col{flex:1;min-width:140px;display:flex;flex-direction:column;gap:12px;}
  .match-col h4{text-align:center;font-family:'Fredoka';color:var(--berry-dark);margin:0 0 6px;font-size:.9rem;text-transform:uppercase;letter-spacing:.04em;}

  /* ---------- MCQ options ---------- */
  .options{display:grid;grid-template-columns:1fr;gap:10px;margin-top:16px;}
  .options.grid3{grid-template-columns:1fr 1fr 1fr;}
  .opt-btn{
    background:#fff;border:2.5px solid var(--pink-2);color:var(--ink);
    border-radius:14px;padding:14px 8px;font-family:'Fredoka';font-weight:600;
    font-size:1.1rem;text-align:center;
  }
  .opt-btn:hover{border-color:var(--berry-1);}
  .opt-btn.correct{background:#e3fbf3;border-color:var(--mint);color:#1a8a63;}
  .opt-btn.wrong{background:#ffe9e9;border-color:#f08a8a;color:#c23c3c;}
  .opt-btn.selected{background:var(--pink-2);border-color:var(--berry-1);color:var(--berry-dark);}
  .feedback.neutral{color:var(--berry-dark);}
  .opt-btn[disabled]{pointer-events:none;}

  .feedback{
    text-align:center;font-weight:800;font-family:'Fredoka';font-size:1.05rem;
    min-height:1.6rem;margin-top:12px;
  }
  .feedback.good{color:#1a8a63;}
  .feedback.bad{color:#c23c3c;}

  .q-progress{text-align:center;font-weight:800;color:#a85778;font-size:.8rem;margin-bottom:6px;letter-spacing:.03em;text-transform:uppercase;}

  /* ---------- Balloon Pop (multi-select) ---------- */
  .balloon-field{
    position:relative;min-height:300px;border-radius:20px;
    background:linear-gradient(180deg,#eaf6ff,#f8fcff);
    border:2.5px dashed #bfe0ff;overflow:hidden;margin-top:14px;
  }
  .balloon{
    position:absolute;width:118px;height:104px;
    display:flex;align-items:center;justify-content:center;text-align:center;
    border-radius:50% 50% 50% 50% / 58% 58% 42% 42%;
    font-family:'Fredoka';font-weight:700;font-size:.92rem;color:#fff;
    box-shadow:inset 0 -10px 14px rgba(0,0,0,.12);
    animation:floaty 3.6s ease-in-out infinite;
    padding:6px;
  }
  .balloon::after{
    content:'';position:absolute;bottom:-14px;left:50%;transform:translateX(-50%);
    width:2px;height:16px;background:#999;
  }
  .balloon.correct-pop{outline:4px solid var(--mint);}
  .balloon.wrong-pop{outline:4px solid #f08a8a;}
  .balloon.popped{animation:none;opacity:0;transform:scale(1.5);pointer-events:none;}
  @keyframes floaty{0%,100%{transform:translateY(0);}50%{transform:translateY(-14px);}}

  /* ---------- Mystery clues ---------- */
  .clue-list{list-style:none;padding:0;margin:14px 0;display:flex;flex-direction:column;gap:10px;}
  .clue-list li{
    background:var(--pink-1);border:2px solid var(--pink-2);border-radius:14px;
    padding:12px 16px;font-family:'Fredoka';font-weight:600;color:var(--berry-dark);
    display:flex;align-items:center;gap:10px;
  }
  .clue-list li .num{font-size:1.3rem;color:var(--berry-2);}

  /* ---------- Stars ---------- */
  .stars-row{display:flex;justify-content:center;gap:4px;margin:6px 0;}
  .star-icon{font-size:1.3rem;}

  /* ---------- Reward ---------- */
  .reward-card{
    text-align:center;padding:36px 22px;
    background:linear-gradient(160deg,#fff,var(--pink-1));
  }
  .badge-circle{
    width:130px;height:130px;border-radius:50%;margin:0 auto 16px;
    background:linear-gradient(135deg,var(--butter),var(--butter-dark));
    display:flex;align-items:center;justify-content:center;font-size:3.4rem;
    box-shadow:0 14px 26px rgba(230,168,0,.4);
    border:6px solid #fff;
  }
  .reward-card h2{color:var(--berry-dark);font-size:1.7rem;margin:0 0 4px;}
  .reward-card p{color:#7a3a5a;font-weight:700;margin:0 0 10px;}
  .next-lesson-card{
    margin-top:22px;background:#fff;border:2.5px solid var(--pink-2);
    border-radius:18px;padding:16px;display:flex;align-items:center;gap:14px;
    text-align:left;
  }
  .next-lesson-card .lock-icon{font-size:1.6rem;}
  .next-lesson-card .txt small{display:block;color:#a85778;font-weight:800;font-size:.7rem;letter-spacing:.04em;text-transform:uppercase;}
  .next-lesson-card .txt strong{font-family:'Fredoka';color:var(--berry-dark);font-size:1.05rem;}

  @media (max-width:480px){
    .big-number{font-size:2.7rem;}
    .equation-row{font-size:1.25rem;}
    .place-chip{padding:8px 12px;}
    .options.grid3{grid-template-columns:1fr 1fr;}
    .balloon{width:100px;height:92px;font-size:.8rem;}
    .place-box{width:74px;height:56px;font-size:1.1rem;}
  }
  @media (prefers-reduced-motion: reduce){
    .balloon, .stage{animation:none;}
  }
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-inner">
    <a class="back-btn" href="../lessons.html">&larr; Chapter</a>
    <div class="lesson-title">
      <small>Grade 2 · Math · Chapter 1: Numbers</small>
      🧱 Lesson 3: Expanded Form
    </div>
    <div class="stars-count"><span id="starTotal">0</span> ⭐</div>
  </div>
  <div class="progress-track" id="progressTrack"></div>
</div>

<div class="stage-wrap" id="stageWrap"></div>

<script>
/* ============================================================
   LESSON 3: EXPANDED FORM — self-contained, no shared engine.js
   Progress saved via ../../../../../../assets/js/progress.js
   (falls back to local localStorage if that file is unavailable)
============================================================ */
const TOPIC_ID = "grade2-math-ch1-lesson3-expanded-form";
let totalStars = 0;

/* ---- optional shared progress helper (safe if missing) ---- */
(function loadProgressHelper(){
  try{
    const s = document.createElement('script');
    s.src = "../../../../../../assets/js/progress.js";
    document.head.appendChild(s);
  }catch(e){ /* no-op: local fallback below still works */ }
})();
function saveStepDone(step){
  try{
    if (typeof setStepDone === 'function'){ setStepDone(TOPIC_ID, step, true); return; }
  }catch(e){}
  try{
    const key = 'progress:' + TOPIC_ID;
    const data = JSON.parse(localStorage.getItem(key) || '{}');
    data[step] = true;
    localStorage.setItem(key, JSON.stringify(data));
  }catch(e){ /* storage unavailable — fail silently, never block the lesson */ }
}

/* ---------------- Speech ---------------- */
let enVoice = null;
function pickVoice(){
  const voices = speechSynthesis.getVoices();
  enVoice = voices.find(v => v.lang === 'en-IN') ||
            voices.find(v => v.lang && v.lang.startsWith('en')) || null;
}
if ('speechSynthesis' in window){
  pickVoice();
  speechSynthesis.onvoiceschanged = pickVoice;
}
function speak(text){
  try{
    if (!('speechSynthesis' in window)) return;
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    if (enVoice) u.voice = enVoice;
    u.rate = 0.88;
    u.lang = 'en-IN';
    speechSynthesis.speak(u);
  }catch(e){ /* speech unavailable — visuals still work */ }
}

/* ---------------- Star tracking ---------------- */
function addStar(n=1){
  totalStars += n;
  document.getElementById('starTotal').textContent = totalStars;
}
function isStageActive(stageId){
  const el = document.getElementById(stageId);
  return !!(el && el.classList.contains('active'));
}
function speakForStage(stageId, text){
  // All stages are BUILT immediately at page load, but only one is
  // SHOWN — without this guard, every hidden stage's setup-time
  // narration fires anyway and overlaps whatever is on screen.
  if (isStageActive(stageId)) speak(text);
}

/* ---------------- helpers ---------------- */
function shuffled(arr){ return [...arr].sort(() => Math.random() - 0.5); }
function splitPlaces(n){
  const h = Math.floor(n/100)*100;
  const t = Math.floor((n%100)/10)*10;
  const o = n%10;
  return {h, t, o};
}
function expandedString(n){
  const {h,t,o} = splitPlaces(n);
  return `${h} + ${t} + ${o}`;
}
function expandedSpoken(n){
  const {h,t,o} = splitPlaces(n);
  return `${h} plus ${t} plus ${o}`;
}

/* ---------------- Stage machine ---------------- */
const STAGES = [
  {id:'s1', label:'See'},
  {id:'s2', label:'Build'},
  {id:'s3', label:'Choose'},
  {id:'s4', label:'Number Builder'},
  {id:'s5', label:'Match It'},
  {id:'s6', label:'Fix It'},
  {id:'s7', label:'Balloon Pop'},
  {id:'s8', label:'Practice'},
  {id:'s9', label:'Mystery Number'},
  {id:'reward', label:'Reward'},
];
let currentStageIndex = 0;

function renderProgressTrack(){
  const track = document.getElementById('progressTrack');
  track.innerHTML = '';
  STAGES.forEach((st, i) => {
    const d = document.createElement('div');
    d.className = 'progress-dot' + (i < currentStageIndex ? ' done' : '') + (i === currentStageIndex ? ' active' : '');
    track.appendChild(d);
  });
}
function goToStage(index){
  currentStageIndex = index;
  document.querySelectorAll('.stage').forEach(el => el.classList.remove('active'));
  const target = document.getElementById(STAGES[index].id);
  if (target) target.classList.add('active');
  renderProgressTrack();
  saveStepDone(STAGES[index].id);
  window.scrollTo({top:0, behavior:'smooth'});
}
function completeStage(){
  if (currentStageIndex < STAGES.length - 1) goToStage(currentStageIndex + 1);
}

const wrap = document.getElementById('stageWrap');

/* ============================================================
   STAGE 1: See — "Break the Number"
============================================================ */
const s1Number = 342;
wrap.insertAdjacentHTML('beforeend', `
<section class="stage" id="s1">
  <div class="stage-header">
    <div class="stage-eyebrow">Activity 1 · See</div>
    <h2>Break the Number</h2>
    <p>Watch how a number breaks into hundreds, tens, and ones.</p>
  </div>
  <div class="card">
    <div class="big-number">${s1Number}</div>
    <div class="blocks-row">
      <div class="block-group">
        <div class="label">3 Hundreds</div>
        <div class="block-grid hundreds-grid" id="s1Hundreds"></div>
      </div>
      <div class="block-group">
        <div class="label">4 Tens</div>
        <div class="block-grid" id="s1Tens"></div>
      </div>
      <div class="block-group">
        <div class="label">2 Ones</div>
        <div class="block-grid" id="s1Ones"></div>
      </div>
    </div>
    <div class="equation-row">
      <div class="place-chip hundreds" id="s1ChipH">300</div>
      <div class="plus">+</div>
      <div class="place-chip tens" id="s1ChipT">40</div>
      <div class="plus">+</div>
      <div class="place-chip ones" id="s1ChipO">2</div>
    </div>
    <div class="row-center">
      <button class="audio-btn" id="s1Listen"><span class="icon">🔊</span> Listen Again</button>
    </div>
    <div class="center-btn-row">
      <button class="btn btn-primary" id="s1Next">Continue ➜</button>
    </div>
  </div>
</section>`);
(function buildS1Blocks(){
  const h = document.getElementById('s1Hundreds');
  for (let i=0;i<3;i++){
    const sq = document.createElement('div');
    sq.className = 'hundred-square';
    for (let j=0;j<25;j++) sq.appendChild(document.createElement('span'));
    h.appendChild(sq);
  }
  const t = document.getElementById('s1Tens');
  for (let i=0;i<4;i++){
    const rod = document.createElement('div');
    rod.className = 'ten-rod';
    t.appendChild(rod);
  }
  const o = document.getElementById('s1Ones');
  for (let i=0;i<2;i++){
    const b = document.createElement('div');
    b.className = 'mini-block ones';
    o.appendChild(b);
  }
})();
function playS1Sequence(){
  ['s1ChipH','s1ChipT','s1ChipO'].forEach(id => document.getElementById(id).classList.remove('show'));
  setTimeout(() => document.getElementById('s1ChipH').classList.add('show'), 300);
  setTimeout(() => document.getElementById('s1ChipT').classList.add('show'), 750);
  setTimeout(() => document.getElementById('s1ChipO').classList.add('show'), 1200);
  setTimeout(() => speakForStage('s1', 'Three hundred forty-two is 300 plus 40 plus 2.'), 1500);
}

      document.querySelectorAll('#s9NumberOptions .opt-btn').forEach(x => x.disabled = true);
      const fb = document.getElementById('s9Feedback');
      if (n === s9Answer){
        b.classList.add('correct');
        fb.textContent = "That's me! 🎉";
        fb.className = 'feedback good';
        addStar(1);
        speak('Correct! I am ' + s9Answer);
        setTimeout(() => {
          document.getElementById('s9Stage1').style.display = 'none';
          document.getElementById('s9Stage2').style.display = 'block';
          fb.textContent = '';
          setupExpandStage();
        }, 1200);
      } else {
        b.classList.add('wrong');
        fb.textContent = 'Try again!';
        fb.className = 'feedback bad';
        speak('Try again.');
      }
    };
    numWrap.appendChild(b);
  });

  function setupExpandStage(){
    const expOpts = shuffled([expandedString(s9Answer), '600 + 3 + 5', '60 + 30 + 5']);
    const expWrap = document.getElementById('s9ExpandOptions');
    expWrap.innerHTML = '';
    expOpts.forEach(exp => {
      const b = document.createElement('button');
      b.className = 'opt-btn';
      b.textContent = exp;
      b.onclick = () => {
        document.querySelectorAll('#s9ExpandOptions .opt-btn').forEach(x => x.disabled = true);
        const fb = document.getElementById('s9Feedback');
        if (exp === expandedString(s9Answer)){
          b.classList.add('correct');
          fb.textContent = 'Excellent! 🏆';
          fb.className = 'feedback good';
          addStar(1);
          speak('Excellent!');
          setTimeout(() => showReward(), 1300);
        } else {
          b.classList.add('wrong');
          fb.textContent = `It's ${expandedString(s9Answer)}.`;
          fb.className = 'feedback bad';
          speak('Not quite.');
          setTimeout(() => showReward(), 1500);
        }
      };
      expWrap.appendChild(b);
    });
  }
})();

wrap.insertAdjacentHTML('beforeend', `
<section class="stage" id="reward">
  <div class="card reward-card">
    <div class="badge-circle">🧱</div>
    <h2>NUMBER BUILDER</h2>
    <p>You can build numbers!</p>
    <div class="stars-row" id="rewardStars"></div>
    <div class="next-lesson-card">
      <div class="lock-icon">🔓</div>
      <div class="txt">
        <small>Next Lesson</small>
        <strong>Place Value</strong>
      </div>
    </div>
  </div>
</section>`);
function showReward(){
  goToStage(STAGES.length - 1);
  const starsRow = document.getElementById('rewardStars');
  starsRow.innerHTML = '';
  for (let i=0;i<5;i++){
    const s = document.createElement('span');
    s.className = 'star-icon';
    s.textContent = '⭐';
    starsRow.appendChild(s);
  }
  saveStepDone('lesson3-complete');
  speak('Great job! You can build numbers!');
}

renderProgressTrack();
goToStage(0);
